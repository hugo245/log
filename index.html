<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayVerse Payment Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F5F6F8;
      --surface: #FFFFFF;
      --row-alt: #FAFAFB;
      --input-bg: #FCFCFD;
      --ink: #171A21;
      --ink-soft: #5B616E;
      --muted: #8A93A3;
      --line: #E4E7ED;
      --accent: #3730D9;
      --accent-soft: #EEEDFB;
      --accent-soft-strong: #E2E0FA;
      --btn-primary-bg: #171A21;
      --btn-primary-bg-hover: #000000;
      --btn-primary-text: #FFFFFF;
      --warn-bg: #FFF7E6;
      --warn-line: #F1E4BC;
      --warn-text: #8A6300;
      --ok-bg: #E9F7EF;
      --ok-line: #C7E9D3;
      --ok-text: #178A4C;
      --ok-text-hover: #126B3B;
      --err-bg: #FDEDEC;
      --err-line: #F5C6C0;
      --err-text: #B3311C;
      --radius: 14px;
    }

    :root[data-theme="dark"] {
      --bg: #101114;
      --surface: #1A1B20;
      --row-alt: #1E2026;
      --input-bg: #1E2026;
      --ink: #E6E7EB;
      --ink-soft: #9DA1AC;
      --muted: #6B707C;
      --line: #2A2C33;
      --accent: #7C76E8;
      --accent-soft: #23222E;
      --accent-soft-strong: #2C2A3C;
      --btn-primary-bg: #E6E7EB;
      --btn-primary-bg-hover: #FFFFFF;
      --btn-primary-text: #14161A;
      --warn-bg: #2A2313;
      --warn-line: #443A1E;
      --warn-text: #D8AC50;
      --ok-bg: #132420;
      --ok-line: #1F3B32;
      --ok-text: #4FBF8B;
      --ok-text-hover: #6DD6A3;
      --err-bg: #2A1917;
      --err-line: #45241F;
      --err-text: #E2837A;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    body,
    .panel,
    .topbar,
    input,
    select,
    textarea {
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: .1px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .brand small {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar a.link {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .topbar a.link:hover {
      color: var(--ink);
    }

    .acct-menu {
      position: relative;
    }

    .acct-menu summary {
      list-style: none;
      cursor: pointer;
    }

    .acct-menu summary::-webkit-details-marker {
      display: none;
    }

    .acct-menu-list {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      min-width: 170px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .acct-menu-list a,
    .acct-menu-list button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

    .acct-menu-list a:hover,
    .acct-menu-list button:hover {
      background: var(--bg);
    }

    .acct-menu-list .acct-menu-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 2px;
    }

    .acct-menu-list .acct-menu-label {
      padding: 6px 10px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .hr-pill {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .hr-pill:hover {
      background: var(--bg);
    }

    .hr-pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .theme-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--bg);
      border-color: var(--accent);
    }

    .hr-pill .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok-text);
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .create-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width:900px) {
      .create-grid {
        grid-template-columns: 1fr;
      }
    }

    .heading-block {
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .sub {
      color: var(--ink-soft);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 54ch;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 7px;
      letter-spacing: .2px;
    }

    .field .hint {
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
    }

    .hint {
      font-weight: 400;
      color: var(--muted);
      font-size: 12.5px;
    }

    .field .err-hint {
      color: var(--err-text);
      font-size: 12px;
      margin-top: 5px;
    }

    input[type=text],
    input[type=number],
    input[type=password],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--input-bg);
      transition: border-color .15s, box-shadow .15s;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }

    input.field-invalid,
    textarea.field-invalid,
    select.field-invalid {
      border-color: var(--err-line);
      background: var(--err-bg);
    }

    input:disabled {
      background: var(--bg);
      color: var(--ink-soft);
      cursor: not-allowed;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      border-radius: 9px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform .12s, box-shadow .12s, background .12s, opacity .12s;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--btn-primary-bg-hover);
    }

    .btn-ghost {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-ghost:hover {
      background: var(--accent-soft-strong);
    }

    .btn-ok {
      background: var(--ok-text);
      color: #fff;
    }

    .btn-ok:hover {
      background: var(--ok-text-hover);
    }

    .btn-ok:disabled {
      background: var(--ok-bg);
      color: var(--ok-text);
      cursor: default;
      opacity: 1;
    }

    .btn-danger-ghost {
      background: var(--err-bg);
      color: var(--err-text);
    }

    .btn-danger-ghost:hover {
      background: var(--err-line);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12.5px;
      border-radius: 7px;
    }

    .btn-xs {
      padding: 5px 10px;
      font-size: 11.5px;
      border-radius: 6px;
      gap: 4px;
    }

    .btn-equal {
      flex: 1 1 0;
      width: auto;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .preview-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .invoice {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(20, 22, 30, .03), 0 8px 24px -14px rgba(20, 22, 30, .16);
      overflow: hidden;
    }

    .invoice-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 26px 32px 22px;
    }

    .doc-type {
      text-align: right;
    }

    .doc-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .doc-id {
      font-size: 13px;
      color: var(--ink);
      font-weight: 600;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 0;
    }

    .parties {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 20px 32px;
      gap: 20px;
    }

    .party-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .party-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .party-value.mono {
      font-size: 13px;
    }

    @media (max-width:640px) {
      .parties {
        grid-template-columns: 1fr 1fr;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr !important;
      }
    }

    .task-block {
      padding: 20px 32px;
      border-top: 1px solid var(--line);
    }

    .task-label {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 7px;
    }

    .task-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.2px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 4px 32px 20px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
    }

    .stat-card .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-card.stat-status .stat-value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .stat-card.stat-status.is-paid .stat-value {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .items-block {
      padding: 20px 32px 10px;
      border-top: 1px solid var(--line);
    }

    .items-head {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    .items-list {
      margin: 0;
      padding-left: 20px;
    }

    .items-list li {
      font-size: 13.8px;
      line-height: 1.7;
      color: var(--ink);
      padding: 6px 0 6px 4px;
    }

    .items-list li::marker {
      color: var(--muted);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .items-list li .lead {
      font-weight: 600;
      color: var(--ink);
    }

    .empty-note {
      color: var(--muted);
      font-size: 13px;
      padding: 6px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 32px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .total-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .total-value {
      font-size: 25px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: -.3px;
    }

    .robux-icon {
      height: 1em;
      width: 1em;
      display: inline-block;
      object-fit: contain;
      flex-shrink: 0;
      vertical-align: -0.15em;
    }

    .invoice-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .foot-contact {
      font-size: 12px;
      color: var(--muted);
    }

    .confirm-box {
      background: var(--ok-bg);
      border: 1px solid var(--ok-line);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .confirm-box .icon {
      font-size: 18px;
      line-height: 1;
    }

    .confirm-box .txt strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 3px;
    }

    .confirm-box .txt span {
      color: var(--ink-soft);
      font-size: 13px;
    }

    .error-box {
      background: var(--err-bg);
      border: 1px solid var(--err-line);
      color: var(--err-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .warn-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gate-shell {
      max-width: 400px;
      margin: 90px auto;
      padding: 0 20px;
    }

    .gate-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px 28px;
      text-align: center;
    }

    .gate-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .gate-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .gate-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .gate-card .field {
      text-align: left;
    }

    .gate-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .roblox-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .roblox-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .lock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 26, 33, .55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .lock-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px -20px rgba(20, 22, 30, .45);
    }

    .lock-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .lock-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .lock-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .lock-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .inline-link-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
    }

    .closed-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .closed-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--err-bg);
      border: 1px solid var(--err-line);
      color: var(--err-text);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .closed-icon.warn {
      background: var(--warn-bg);
      border-color: var(--warn-line);
      color: var(--warn-text);
    }

    .closed-note {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .dash-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .dash-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
    }

    .dash-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px;
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 12.5px;
      padding: 7px 13px;
      border-radius: 6px;
      color: var(--ink-soft);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .filter-select-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-select {
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--line);
      padding: 0 10px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      color: var(--ink);
      background: var(--surface);
      max-width: 160px;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table.req-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }

    table.req-table thead th {
      text-align: left;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      padding: 11px 14px;
      background: var(--row-alt);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    table.req-table tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    table.req-table tbody tr:last-child td {
      border-bottom: none;
    }

    table.req-table tbody tr:hover {
      background: var(--row-alt);
    }

    table.req-table td.id-cell {
      color: var(--muted);
      font-size: 11.5px;
    }

    table.req-table td.name-cell strong {
      display: block;
      color: var(--ink);
      font-size: 13.5px;
    }

    table.req-table td.name-cell span {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 2px;
    }

    table.req-table td.name-cell .method-note {
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
    }

    table.req-table td.name-cell .method-note.has-method {
      color: var(--ok-text);
    }

    table.req-table td.name-cell .method-note.missing-method {
      color: var(--warn-text);
    }

    .an-table .method-note {
      font-size: 12.5px;
      font-weight: 600;
    }

    .an-table .method-note.has-method {
      color: var(--ok-text);
    }

    .an-table .method-note.missing-method {
      color: var(--warn-text);
    }

    table.req-table td.task-cell {
      max-width: 280px;
    }

    table.req-table td.task-cell .task-name {
      font-weight: 600;
      color: var(--ink);
    }

    table.req-table td.task-cell .task-count {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 2px;
    }

    table.req-table td.pay-cell {
      white-space: nowrap;
      font-weight: 700;
    }

    table.req-table td.pay-cell img {
      height: 1em;
      width: 1em;
      object-fit: contain;
      vertical-align: -0.08em;
      margin-right: 4px;
    }

    table.req-table td.actions-cell {
      white-space: normal;
      max-width: 180px;
    }

    table.req-table td.actions-cell .actions-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    table.req-table td.actions-cell .btn {
      margin: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .status-chip.pending {
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .status-chip.paid {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .expand-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    tr.detail-row td {
      background: var(--row-alt);
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
    }

    tr.detail-row .detail-list {
      margin: 0;
      padding-left: 18px;
      font-size: 12.8px;
      color: var(--ink);
      line-height: 1.7;
    }

    tr.detail-row .detail-empty {
      color: var(--muted);
      font-size: 12.5px;
    }

    .dash-empty {
      text-align: center;
      padding: 70px 20px;
      color: var(--ink-soft);
    }

    .dash-empty h3 {
      color: var(--ink);
      font-size: 18px;
      margin-bottom: 6px;
    }

    .dash-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 22px;
    }

    .game-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .skill-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-soft-strong);
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .manage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width:820px) {
      .manage-grid {
        grid-template-columns: 1fr;
      }
    }

    .rate-display {
      font-size: 36px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.5px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .rate-display .rate-sub {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
    }

    .game-chip-wrap {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .game-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      margin: 0 8px 8px 0;
    }

    .game-chip .del {
      cursor: pointer;
      opacity: .55;
      font-weight: 800;
      font-size: 14px;
      line-height: 1;
    }

    .game-chip .del:hover {
      opacity: 1;
    }

    .perm-chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .perm-chip {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }

    .team-chip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }

    .team-chip-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .team-chip,
    .skillset-chip {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      white-space: nowrap;
    }

    .skillset-chip {
      font-weight: 600;
      opacity: .85;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .staff-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      position: relative;
    }

    .staff-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(23, 26, 33, .08);
      border-color: var(--accent);
    }

    .staff-card .avatar-wrap {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--bg);
      border: 2px solid var(--line);
      flex-shrink: 0;
    }

    .staff-card .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .staff-card .staff-name {
      font-weight: 700;
      font-size: 14.5px;
      color: var(--ink);
      word-break: break-word;
    }

    .staff-card .staff-id {
      font-size: 11px;
      color: var(--muted);
      margin-top: -6px;
    }

    .staff-card .staff-roles {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }

    .staff-card .staff-stats-row {
      display: flex;
      gap: 14px;
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      width: 100%;
      justify-content: center;
    }

    .staff-card .staff-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .staff-card .staff-stat b {
      font-size: 13.5px;
      color: var(--ink);
    }

    .staff-card .staff-stat span {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .staff-card .pending-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn-text);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 28, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      animation: fadeIn .12s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-card {
      background: var(--surface);
      border-radius: 18px;
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .22);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .modal-close:hover {
      background: var(--bg);
      color: var(--ink);
    }

    .modal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding: 32px 24px 20px;
      background: linear-gradient(180deg, var(--accent-soft), var(--surface));
      border-radius: 18px 18px 0 0;
    }

    .modal-header .avatar-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--surface);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      background: var(--bg);
    }

    .modal-header .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }

    .modal-header .modal-id {
      font-size: 12px;
      color: var(--muted);
    }

    .modal-body {
      padding: 20px 24px 26px;
    }

    .modal-section {
      margin-bottom: 18px;
    }

    .modal-section:last-child {
      margin-bottom: 0;
    }

    .modal-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .modal-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .modal-stat-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .modal-stat-box b {
      display: block;
      font-size: 15px;
      color: var(--ink);
    }

    .modal-stat-box span {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .modal-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .modal-info-row:last-child {
      border-bottom: none;
    }

    .modal-info-row .label {
      color: var(--ink-soft);
      font-weight: 500;
    }

    .modal-info-row .value {
      font-weight: 600;
      color: var(--ink);
      text-align: right;
    }

    .onboard-bar-track {
      height: 7px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
      margin-top: 8px;
    }

    .onboard-bar-fill {
      height: 100%;
      background: var(--ok-text);
      border-radius: 999px;
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .view-toggle button {
      border: none;
      background: var(--surface);
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
    }

    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    .perm-check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .perm-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .perm-check-item input {
      width: auto;
    }

    .role-row {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .role-row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .role-row-top strong {
      font-size: 14px;
      color: var(--ink);
    }

    .role-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .assignment-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .assignment-row:last-child {
      border-bottom: none;
    }

    .owed-hero {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px 32px;
      margin-bottom: 24px;
    }

    .owed-hero .owed-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .owed-hero .owed-amounts {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: baseline;
    }

    .owed-hero .owed-amount {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .owed-hero .owed-amount .val {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.4px;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .owed-hero .owed-amount .val img {
      height: .82em;
      width: .82em;
      object-fit: contain;
    }

    .owed-hero .owed-amount .cur-label {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .owed-hero .owed-sub {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--muted);
    }

    .stat-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    @media (max-width:900px) {
      .stat-strip {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width:640px) {
      .topbar {
        padding: 12px 14px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .brand {
        font-size: 13px;
      }

      .brand small {
        display: none;
      }

      .topbar-right {
        flex-wrap: wrap;
        gap: 6px;
        width: 100%;
      }

      .hr-pill {
        font-size: 12px;
        padding: 7px 10px;
      }

      .shell {
        padding: 24px 14px 60px;
      }

      .dash-shell {
        padding: 20px 14px 60px;
      }

      h1 {
        font-size: 22px;
      }

      .sub {
        max-width: none;
      }

      .panel {
        padding: 18px;
      }

      .row2,
      .row3 {
        grid-template-columns: 1fr;
      }

      .dash-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .dash-toolbar {
        width: 100%;
      }

      .dash-toolbar .btn,
      .dash-toolbar a {
        flex: 1 1 auto;
      }

      .tabs {
        width: 100%;
        overflow-x: auto;
      }

      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-select-group {
        width: 100%;
      }

      .filter-select {
        flex: 1 1 auto;
      }

      .perm-check-grid {
        grid-template-columns: 1fr;
      }

      .owed-hero .owed-amounts {
        flex-direction: column;
        gap: 14px;
      }

      .role-row-top {
        flex-wrap: wrap;
        gap: 8px;
      }

      .modal-scrim {
        padding: 12px;
      }

      .modal-stat-grid {
        grid-template-columns: 1fr 1fr;
      }

      .acct-menu-list {
        min-width: 150px;
      }

      .invoice-top,
      .parties,
      .task-block,
      .stat-grid,
      .items-block,
      .total-row {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    .stat-strip .strip-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .stat-strip .strip-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-strip .strip-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-strip .strip-value img {
      height: .8em;
      width: .8em;
      object-fit: contain;
    }

    .an-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    @media (max-width:980px) {
      .an-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 18px 10px;
    }

    .chart-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .chart-card-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .chart-card-sub {
      font-size: 11.5px;

    .person-input-wrap {

      flex: 1 1 180px;

    .an-toggle-group {

      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 3px;

    .an-toggle-btn {

      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;

      padding: 6px 11px;
      border-radius: 6px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .an-toggle-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .search-input-wrap {

      flex: 1;
      min-width: 200px;
    }

    .search-input-wrap input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      background: var(--surface);
    }

    .search-input-wrap input:focus {

      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);

    .explore-panel {
      display: flex;
      align-items: stretch;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 22px;
    }

    .explore-sidebar {
      width: 230px;
      flex: 0 0 230px;
      padding: 18px 16px 20px;
      border-right: 1px solid var(--line);
      background: var(--row-alt);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .explore-panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .explore-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .explore-field>label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .explore-select {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 10px;
      font-size: 12.5px;
      font-family: inherit;
      font-weight: 500;
      color: var(--ink);
      background: var(--surface);
    }

    .explore-range-select {
      width: auto;
      min-width: 150px;

    .explore-chart-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .explore-chart-type-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      font-family: inherit;
      font-weight: 600;
      font-size: 11.5px;
      padding: 9px 6px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
    }

    .explore-chart-type-full {
      width: 100%;
      margin-top: 6px;
    }

    .explore-chart-type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .explore-radio-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .explore-radio {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
    }

    .explore-radio input {
      accent-color: var(--accent);
    }

    .explore-radio-disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .explore-main {
      flex: 1;
      min-width: 0;
      padding: 18px 20px 20px;
    }

    .explore-main-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .explore-metric-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .explore-metric-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .explore-big-number {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.4px;
      margin-top: 8px;
    }

    .explore-chart-area {
      position: relative;
      height: 320px;
    }

    .explore-table-wrap {
      margin-bottom: 0;
    }

    @media (max-width:860px) {

        flex-direction: column;

      .explore-sidebar {
        width: auto;
        flex: none;
        border-right: none;
        border-bottom: 1px solid var(--line);
        flex-direction: row;
        flex-wrap: wrap;
      }

      .explore-sidebar .explore-field {
        flex: 1 1 160px;
      }

      .explore-chart-area {
        height: 260px;
      }
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(23, 26, 33, .12);
      z-index: 20;
      max-height: 220px;
      overflow-y: auto;
    }

    .autocomplete-item {
      padding: 9px 12px;
      font-size: 13.5px;
      cursor: pointer;
      color: var(--ink);
    }

    .autocomplete-item:hover,
    .autocomplete-item.is-active {
      background: var(--accent-soft);
    }

    .autocomplete-item+.autocomplete-item {
      border-top: 1px solid var(--line);
    }

    .status-chip.rejected {
      background: var(--err-bg);
      color: var(--err-text);
      border: 1px solid var(--err-line);
    }

    .status-note {
      font-size: 11.5px;
      color: var(--err-text);
      margin-top: 4px;
    }

    .method-option {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .method-option input {
      width: auto;
    }

    .method-option.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .method-option .mo-label {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--ink);
    }

    .method-option .mo-sub {
      font-size: 11.5px;
      color: var(--muted);
    }

    .elig-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .elig-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .elig-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .elig-check.is-ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .elig-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--ink);
    }

    .elig-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .elig-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 13.5px;
      font-weight: 600;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .elig-summary.is-ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .eligibility-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: .3px;
      margin-top: 4px;
    }

    .eligibility-chip.eligible {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .eligibility-chip.not-eligible {
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .eligibility-chip.unknown {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    ::selection {
      background: var(--accent-soft);
    }

    .user-link {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .user-link:hover {
      text-decoration: underline;
    }

    .category-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      text-transform: capitalize;
      white-space: nowrap;
    }

    .category-chip.payments {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: var(--ok-line);
    }

    .category-chip.moderation {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-line);
    }

    .category-chip.backups {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--line);
    }

    .audit-reverted-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--err-text);
      margin-left: 8px;
    }

    table.req-table td.audit-details-cell {
      max-width: 320px;
      white-space: normal;
      font-size: 12.5px;
      color: var(--muted);
    }

    .backup-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .backup-card .backup-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .backup-card .backup-meta .mono {
      font-size: 12px;
      color: var(--muted);
    }

    .um-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .roling-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin: 4px 0 6px;
    }

    .roling-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 96px;
    }

    .roling-step-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .roling-step-done .roling-step-icon {
      background: var(--ok-bg);
      border: 1px solid var(--ok-line);
    }

    .roling-step-pending .roling-step-icon {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
    }

    .roling-step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .roling-step-connector {
      width: 44px;
      height: 2px;
      background: var(--line);
      margin-bottom: 24px;
      flex: 0 0 auto;
    }

    .topbar-search {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 240px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .topbar-search:hover {
      border-color: var(--accent);
      color: var(--ink-soft);
    }

    .topbar-search span {
      flex: 1;
    }

    kbd {
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .app-header .topbar {
      position: static;
    }

    .navstrip {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .navstrip::-webkit-scrollbar {
      display: none;
    }

    .navstrip a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 10px 10px;
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .navstrip a:hover {
      color: var(--ink);
    }

    .navstrip a.active {
      color: var(--ink);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    .navstrip .nav-sep {
      width: 1px;
      background: var(--line);
      margin: 10px 8px;
      flex-shrink: 0;
    }

    .nav-count {
      font-size: 11px;
      font-weight: 700;
      background: var(--accent-soft-strong);
      color: var(--accent);
      border-radius: 999px;
      padding: 1px 7px;
    }

    @media (max-width:640px) {
      .topbar-search {
        min-width: 0;
        width: 36px;
        height: 36px;
        padding: 0;
        justify-content: center;
      }

      .topbar-search span,
      .topbar-search kbd {
        display: none;
      }

      .navstrip {
        padding: 0 8px;
      }
    }

    .cmdk-scrim {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 28, .45);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12vh 16px 16px;
    }

    .cmdk {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .25);
      overflow: hidden;
    }

    .cmdk input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 16px 18px;
      font: inherit;
      font-size: 15px;
      background: transparent;
      color: var(--ink);
      outline: none;
    }

    .cmdk-list {
      max-height: 52vh;
      overflow-y: auto;
      padding: 6px;
    }

    .cmdk-group {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      padding: 10px 12px 4px;
    }

    .cmdk-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }

    .cmdk-item img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .cmdk-item .cmdk-meta {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .cmdk-item.sel {
      background: var(--accent-soft);
    }

    .cmdk-empty {
      padding: 22px 14px;
      color: var(--ink-soft);
      font-size: 13.5px;
      text-align: center;

    .cmdk-foot {

      gap: 14px;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    #toastRoot {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      max-width: min(480px, 90vw);
      animation: toastIn .18s ease;
    }

    .toast.err {
      background: var(--err-text);
      color: #fff;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .pp-scrim {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 28, .4);
      z-index: 9999;
      display: flex;
      justify-content: flex-end;
    }

      width: 100%;
      max-width: 520px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: ppIn .18s ease;

      flex: 1;
      overflow-y: auto;
    }

    .pp-tabs {
      display: flex;
      gap: 2px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

      border: none;
      background: none;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      padding: 11px 10px 10px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pp-tabs button:hover {
      color: var(--ink);
    }

    .pp-tabs button.on {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;

      flex-direction: column;
      gap: 2px;

      font-size: 11.5px;
      color: var(--muted);
    }

    .pp-summary {

      gap: 10px;

      padding: 12px 0;

      font-weight: 600;
      color: var(--ink-soft);

      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;

    .pp-tag {

      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
    }

    .pp-linkbtn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }

    .pp-linkbtn:hover {
      text-decoration: underline;
    }

    .pp-sub a {
      color: inherit;
    }

    .pp-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .pp-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .pp-list>.hint {
      padding: 12px;
    }

    .pp-item,
    .pp-role {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-top: 1px solid var(--line);
    }

    .pp-item:first-child,
    .pp-role:first-child {
      border-top: none;
    }

    .pp-item-main,
    .pp-role-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pp-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .pp-inline-label {
      font-size: 11.5px;
      color: var(--muted);
    }

    .pp-select {
      font: inherit;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--input-bg);
      color: var(--ink);
      max-width: 100%;
    }

    .pp-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .pp-icon-btn:hover:not(:disabled) {
      color: var(--err-text);
      border-color: var(--err-line);
      background: var(--err-bg);
    }

    .pp-add {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    .pp-add .pp-select {
      flex: 1 1 150px;
    }

    .pp-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pp-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px dashed var(--line);
      background: none;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .pp-toggle:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--ink);
    }

    .pp-toggle.on {
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
    }

    .pp-toggle:disabled {
      cursor: default;
    }

    .pp-toggle-note {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .pp-role {
      cursor: pointer;
    }

    .pp-role.locked {
      cursor: not-allowed;
      opacity: .6;
    }

    .pp-role-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .pp-switch {
      appearance: none;
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: var(--line);
      position: relative;
      cursor: inherit;
      flex-shrink: 0;
      margin: 0;
      transition: background .15s ease;
    }

    .pp-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
      transition: transform .15s ease;
    }

    .pp-switch:checked {
      background: var(--accent);
    }

    .pp-switch:checked::after {
      transform: translateX(16px);
    }

    .pp-methods {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pp-method {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
    }

    .pp-method>span {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 14px;
    }

    .pp-method.on {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pp-method.blocked {
      opacity: .55;
      cursor: not-allowed;
    }

    .pp-method input {
      margin-top: 3px;
    }

    @media (max-width:480px) {
      .pp-stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    @keyframes ppIn {
      from {
        transform: translateX(24px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .pp,
      .toast {
        animation: none;
      }
    }

    .pp-head {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .pp-head img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-soft);
      flex-shrink: 0;
    }

    .pp-head h2 {
      margin: 0 0 2px;
      font-size: 18px;
    }

    .pp-sub {
      color: var(--ink-soft);
      font-size: 12.5px;
    }

    .pp-sub button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      padding: 0;
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .pp-body {
      padding: 18px 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .pp-section h3 {
      font-size: 13px;
      margin: 0 0 10px;
      color: var(--ink);
    }

    }

    .pp-state {

      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink-soft);
    }

    .pp-state.warn {
      background: var(--warn-bg);
      border-color: var(--warn-line);
      color: var(--warn-text);
    }

    .pp-state.ban {
      background: var(--err-bg);
      border-color: var(--err-line);
      color: var(--err-text);
    }

    .pp-state.ok {
      background: var(--ok-bg);
      border-color: var(--ok-line);
      color: var(--ok-text);
    }

    .pp-banner {
      border: 1px solid var(--err-line);
      background: var(--err-bg);
      color: var(--err-text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13.5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

      border-color: var(--line);
      background: var(--row-alt);
      color: var(--ink-soft);
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 12px;
    }

    .seg button {
      border: none;
      background: none;
      padding: 7px 8px;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .seg button.on {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .seg button.on[data-mode="ban"] {
      background: var(--err-bg);
      color: var(--err-text);
    }

    .reason-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: -2px 0 12px;
    }

    .reason-chips button {
      border: 1px dashed var(--line);
      background: none;
      color: var(--ink-soft);
      font: inherit;
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .reason-chips button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pp-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pp-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-soft);
      margin: 4px 0 14px;

      display: flex;
      gap: 4px;

      width: 22px;

    }

      background: var(--err-text);

    .timeline {
      list-style: none;

      padding: 0;

      margin-left: 5px;
    }

    .timeline li {
      position: relative;
      padding: 0 0 16px 16px;
    }

    .timeline li::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--muted);
    }

    .timeline li.t-warn::before {
      border-color: var(--warn-text);
    }

    .timeline li.t-ban::before {
      border-color: var(--err-text);
      background: var(--err-text);
    }

    .timeline li.t-good::before {
      border-color: var(--ok-text);
    }

    .timeline li.t-note::before {
      border-color: var(--accent);
    }

    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
      return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
    }
    function gameColor(name) {
      const s = String(name || '');
      let hash = 0;
      for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return hslToHex(hue, 65, 45);
    }

    function copyText(text, btn, label) {
      const done = () => flashBtn(btn, label || 'Copied!');
      const legacyCopy = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) done(); else flashBtn(btn, 'Select and copy');
        } catch (e) { flashBtn(btn, 'Select and copy'); }
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    function flashBtn(btn, msg) {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = msg;

    function parseWorkLines(raw) {
      return String(raw || '')
        .split('\n')
        .map(l => l.trim().replace(/^->\s*/, '').replace(/^-\s*/, ''))
        .filter(Boolean)
        .map(text => {
          let lead = text, rest = '';
          const periodIdx = text.indexOf('. ');
          if (periodIdx !== -1) { lead = text.slice(0, periodIdx + 1); rest = text.slice(periodIdx + 2); }
          return { lead, rest };
        });
    }

    async function verifySession() {
      const token = getStoredToken();
      if (!token) { isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; hrMaxHierarchy = 0; teamRemoved = false; return; }
      try {
        const [res, onboardingResult] = await Promise.all([
          fetch(EDGE_BASE + '/hr-session', {
            headers: {
              Authorization: 'Bearer ' + token,
              'ngrok-skip-browser-warning': 'true'
            }
          }),
          loadMyOnboarding().catch(() => null)
        ]);
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.ok) {
          isHrAuthed = true;
          hrUsername = json.robloxUsername || '';
          hrUserId = json.robloxUserId || null;
          hrRoles = json.roles || [];
          hrPermissions = json.permissions || [];
          hrMaxHierarchy = json.maxHierarchy || 0;
          teamRemoved = json.teamRemoved === true;
          hrTeamState = json.teamState || (json.teamRemoved ? 'removed' : 'ok');
          needsDiscordLink = json.discordLinked === false;
          needsOnboarding = teamRemoved ? false : (onboardingResult ? onboardingResult.some(s => s.required && !s.completedAt) : false);
        } else {
          isHrAuthed = false;
          hrUsername = '';
          hrRoles = [];
          hrPermissions = [];
          hrMaxHierarchy = 0;
          needsOnboarding = false;
          needsDiscordLink = false;
          teamRemoved = false;
          clearToken();
        }
      } catch (e) {
        isHrAuthed = false;
        hrUsername = '';
        hrRoles = [];
        hrPermissions = [];
        hrMaxHierarchy = 0;
        needsOnboarding = false;
        needsDiscordLink = false;
        teamRemoved = false;
      }
    }

      try {

        needsOnboarding = steps.some(s => s.required && !s.completedAt);
      } catch (e) {

      }
    }

    async function callHrData(action, payload) {
      const token = getStoredToken();
      const res = await fetch(EDGE_BASE + '/hr-data', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + (token || ''),
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ action, payload: payload || {} })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.ok) {
        if (res.status === 401) { clearToken(); isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; hrMaxHierarchy = 0; }
        const code = (json && json.error) || '';
        if (code === 'team_removed' && !teamRemoved) {
          teamRemoved = true;
          if (currentPath() !== '#/team-removed') window.location.hash = '#/team-removed';
        }
        const err = new Error(friendlyError(code));
        err.code = code;
        throw err;
      }
      return json;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    async function enableRecruitPushNotifications(rt) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('unsupported');
      const publicKey = await fetchPushPublicKey();
      if (!publicKey) throw new Error('not_configured');
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') throw new Error('permission_denied');
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
      await fetch(EDGE_BASE + '/recruitment/push-subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + rt, 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });
      return true;
    }
