<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayVerse Payment Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F5F6F8;
      --surface: #FFFFFF;
      --row-alt: #FAFAFB;
      --input-bg: #FCFCFD;
      --ink: #171A21;
      --ink-soft: #5B616E;
      --muted: #8A93A3;
      --line: #E4E7ED;
      --accent: #3730D9;
      --accent-soft: #EEEDFB;
      --accent-soft-strong: #E2E0FA;
      --btn-primary-bg: #171A21;
      --btn-primary-bg-hover: #000000;
      --btn-primary-text: #FFFFFF;
      --warn-bg: #FFF7E6;
      --warn-line: #F1E4BC;
      --warn-text: #8A6300;
      --ok-bg: #E9F7EF;
      --ok-line: #C7E9D3;
      --ok-text: #178A4C;
      --ok-text-hover: #126B3B;
      --err-bg: #FDEDEC;
      --err-line: #F5C6C0;
      --err-text: #B3311C;
      --radius: 14px;
    }

    :root[data-theme="dark"] {
      --bg: #101114;
      --surface: #1A1B20;
      --row-alt: #1E2026;
      --input-bg: #1E2026;
      --ink: #E6E7EB;
      --ink-soft: #9DA1AC;
      --muted: #6B707C;
      --line: #2A2C33;
      --accent: #7C76E8;
      --accent-soft: #23222E;
      --accent-soft-strong: #2C2A3C;
      --btn-primary-bg: #E6E7EB;
      --btn-primary-bg-hover: #FFFFFF;
      --btn-primary-text: #14161A;
      --warn-bg: #2A2313;
      --warn-line: #443A1E;
      --warn-text: #D8AC50;
      --ok-bg: #132420;
      --ok-line: #1F3B32;
      --ok-text: #4FBF8B;
      --ok-text-hover: #6DD6A3;
      --err-bg: #2A1917;
      --err-line: #45241F;
      --err-text: #E2837A;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    body,
    .panel,
    .topbar,
    input,
    select,
    textarea {
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: .1px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .brand small {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar a.link {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .topbar a.link:hover {
      color: var(--ink);
    }

    .acct-menu {
      position: relative;
    }

    .acct-menu summary {
      list-style: none;
      cursor: pointer;
    }

    .acct-menu summary::-webkit-details-marker {
      display: none;
    }

    .acct-menu-list {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      min-width: 170px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .acct-menu-list a,
    .acct-menu-list button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

    .acct-menu-list a:hover,
    .acct-menu-list button:hover {
      background: var(--bg);
    }

    .acct-menu-list .acct-menu-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 2px;
    }

    .acct-menu-list .acct-menu-label {
      padding: 6px 10px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .hr-pill {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .hr-pill:hover {
      background: var(--bg);
    }

    .theme-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--bg);
      border-color: var(--accent);
    }

    .hr-pill .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok-text);
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .create-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width:900px) {
      .create-grid {
        grid-template-columns: 1fr;
      }
    }

    .heading-block {
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .sub {
      color: var(--ink-soft);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 54ch;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 7px;
      letter-spacing: .2px;
    }

    .field .hint {
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
    }

    .hint {
      font-weight: 400;
      color: var(--muted);
      font-size: 12.5px;
    }

    .field .err-hint {
      color: var(--err-text);
      font-size: 12px;
      margin-top: 5px;
    }

    input[type=text],
    input[type=number],
    input[type=password],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--input-bg);
      transition: border-color .15s, box-shadow .15s;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }

    input.field-invalid,
    textarea.field-invalid,
    select.field-invalid {
      border-color: var(--err-line);
      background: var(--err-bg);
    }

    input:disabled {
      background: var(--bg);
      color: var(--ink-soft);
      cursor: not-allowed;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      border-radius: 9px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform .12s, box-shadow .12s, background .12s, opacity .12s;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--btn-primary-bg-hover);
    }

    .btn-ghost {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-ghost:hover {
      background: var(--accent-soft-strong);
    }

    .btn-ok {
      background: var(--ok-text);
      color: #fff;
    }

    .btn-ok:hover {
      background: var(--ok-text-hover);
    }

    .btn-ok:disabled {
      background: var(--ok-bg);
      color: var(--ok-text);
      cursor: default;
      opacity: 1;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12.5px;
      border-radius: 7px;
    }

    .btn-equal {
      flex: 1 1 0;
      width: auto;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .preview-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .invoice {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(20, 22, 30, .03), 0 8px 24px -14px rgba(20, 22, 30, .16);
      overflow: hidden;
    }

    .invoice-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 26px 32px 22px;
    }

    .doc-type {
      text-align: right;
    }

    .doc-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .doc-id {
      font-size: 13px;
      color: var(--ink);
      font-weight: 600;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 0;
    }

    .parties {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 20px 32px;
      gap: 20px;
    }

    .party-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .party-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .party-value.mono {
      font-size: 13px;
    }

    @media (max-width:640px) {
      .parties {
        grid-template-columns: 1fr 1fr;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr !important;
      }
    }

    .task-block {
      padding: 20px 32px;
      border-top: 1px solid var(--line);
    }

    .task-label {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 7px;
    }

    .task-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.2px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 4px 32px 20px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
    }

    .stat-card .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-card.stat-status .stat-value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .stat-card.stat-status.is-paid .stat-value {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .items-block {
      padding: 20px 32px 10px;
      border-top: 1px solid var(--line);
    }

    .items-head {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    .items-list {
      margin: 0;
      padding-left: 20px;
    }

    .items-list li {
      font-size: 13.8px;
      line-height: 1.7;
      color: var(--ink);
      padding: 6px 0 6px 4px;
    }

    .items-list li::marker {
      color: var(--muted);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .items-list li .lead {
      font-weight: 600;
      color: var(--ink);
    }

    .empty-note {
      color: var(--muted);
      font-size: 13px;
      padding: 6px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 32px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .total-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .total-value {
      font-size: 25px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: -.3px;
    }

    .robux-icon {
      height: 1em;
      width: 1em;
      display: inline-block;
      object-fit: contain;
      flex-shrink: 0;
      vertical-align: -0.15em;
    }

    .invoice-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .foot-contact {
      font-size: 12px;
      color: var(--muted);
    }

    .confirm-box {
      background: var(--ok-bg);
      border: 1px solid var(--ok-line);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .confirm-box .icon {
      font-size: 18px;
      line-height: 1;
    }

    .confirm-box .txt strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 3px;
    }

    .confirm-box .txt span {
      color: var(--ink-soft);
      font-size: 13px;
    }

    .error-box {
      background: var(--err-bg);
      border: 1px solid var(--err-line);
      color: var(--err-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .warn-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gate-shell {
      max-width: 400px;
      margin: 90px auto;
      padding: 0 20px;
    }

    .gate-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px 28px;
      text-align: center;
    }

    .gate-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .gate-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .gate-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .gate-card .field {
      text-align: left;
    }

    .gate-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .roblox-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .roblox-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .lock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 26, 33, .55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .lock-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px -20px rgba(20, 22, 30, .45);
    }

    .lock-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .lock-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .lock-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .lock-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .dash-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .dash-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
    }

    .dash-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px;
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 12.5px;
      padding: 7px 13px;
      border-radius: 6px;
      color: var(--ink-soft);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .filter-select-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-select {
      height: 38px;
      border-radius: 9px;

    table.req-table thead th {

      font-size: 10.5px;

      letter-spacing: .6px;
      color: var(--muted);

      border-bottom: 1px solid var(--line);

    table.req-table td.name-cell .method-note.has-method {

    table.req-table td.name-cell .method-note.missing-method {

    }

    .an-table .method-note {
      font-size: 12.5px;
      font-weight: 600;
    }

    .an-table .method-note.has-method {
      color: var(--ok-text);

    .an-table .method-note.missing-method {
      color: var(--warn-text);
    }

    table.req-table td.task-cell .task-name {

      color: var(--ink);

    table.req-table td.task-cell .task-count {
      color: var(--muted);

      margin-top: 2px;

    const ROBUX_IMG = 'https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/e/a/9/ea98f8c6c438d2d8136a6751282a153c6b28b892.png';
    const CURRENCY_SYMBOL = { USD: '$' };

    let DEVEX_RATE = 0.0038;
    let GAMES = [];

    let isHrAuthed = false;
    let hrUsername = '';
    let hrRoles = [];
    let hrPermissions = [];
    let hrMaxHierarchy = 0;
    let authReady = false;
    let appDataReady = false;
    let needsOnboarding = false;

    // Bumped every time route() switches pages. Async page loaders capture
    // the value at the start and check it before repainting, so a slow
    // fetch from a page you've since navigated away from can never
    // overwrite what's currently on screen.
    let renderGen = 0;

    function hasPermission(permission) {
      return hrPermissions.includes(permission);
    }

    function canSubmitRequests() {
      return isHrAuthed && hasPermission('dashboard.submit_request');
    }

    function devexLabel() {
      const per10k = DEVEX_RATE * 10000;
      return `DevEx rate: $${per10k.toFixed(2)} per 10,000 Robux (${DEVEX_RATE})`;
    }

    function fmtAmount(data) {
      const isRobux = data.currency === 'ROBUX';
      const n = isRobux
        ? Number(data.payment || 0).toLocaleString()
        : Number(data.payment || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (isRobux) return `<img class="robux-icon" src="${ROBUX_IMG}" alt="Robux">${n}`;
      return `${CURRENCY_SYMBOL[data.currency] || ''}${n} ${data.currency}`;
    }

    function devexEquivalent(data) {
      if (data.currency !== 'ROBUX') return '';
      const usd = (Number(data.payment) || 0) * DEVEX_RATE;
      return `&asymp; $${usd.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD at DevEx`;
    }

    function robuxEquivalentLabel(data) {
      if (data.currency !== 'USD') return '';
      const usd = Number(data.payment) || 0;
      if (usd <= 0 || !DEVEX_RATE) return '';
      const robux = usd / DEVEX_RATE;
      return `Equal to ${Math.round(robux).toLocaleString()} Robux`;
    }

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
      return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
    }
    function gameColor(name) {
      const s = String(name || '');
      let hash = 0;
      for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return hslToHex(hue, 65, 45);
    }

    function copyText(text, btn, label) {
      const done = () => flashBtn(btn, label || 'Copied!');
      const legacyCopy = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) done(); else flashBtn(btn, 'Select and copy');
        } catch (e) { flashBtn(btn, 'Select and copy'); }
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    function flashBtn(btn, msg) {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    function parseWorkLines(raw) {
      return String(raw || '')
        .split('\n')
        .map(l => l.trim().replace(/^->\s*/, '').replace(/^-\s*/, ''))
        .filter(Boolean)
        .map(text => {
          let lead = text, rest = '';
          const periodIdx = text.indexOf('. ');
          if (periodIdx !== -1) { lead = text.slice(0, periodIdx + 1); rest = text.slice(periodIdx + 2); }
          return { lead, rest };
        });
    }

        <div class="brand"><span class="dot"></span>PlayVerse</div>
        <div class="doc-type">
          <div class="doc-label">Payment Request</div>

        ${data.game ? `<div style="margin-top:9px;"><span class="game-badge" style="background:${gameColor(data.game)};">${esc(data.game)}</span></div>` : ''}
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Time worked</div><div class="stat-value">${esc(data.timeWorked || '-')}</div></div>
        <div class="stat-card"><div class="stat-label">Work items</div><div class="stat-value">${items.length}</div></div>
        <div class="stat-card stat-status${isPaid ? ' is-paid' : ''}"><div class="stat-label">Status</div><div class="stat-value">${isPaid ? `Paid ${esc(fmtDate(data.paidAt || Date.now()))}` : 'Pending'}</div></div>
      </div>
      <div class="items-block">
        <div class="items-head">Work completed</div>
        ${listHtml}
      </div>
      <div class="total-row">
        <div class="total-label">${isPaid ? 'Total Paid' : 'Total Due'}</div>
        <div style="text-align:right;">
          <div class="total-value">${fmtAmount(data)}</div>
          ${data.currency === 'ROBUX' ? `<div style="font-size:11.5px;color:var(--muted);margin-top:3px;">${devexEquivalent(data)}</div>` : ''}
        </div>
      </div>
      <div class="invoice-foot"><span class="foot-contact">${devexLabel()}</span></div>
    </div>`;
    }

    function rowToClient(row) {
      return {
        id: row.id,
        requestedBy: row.requested_by || '',
        robloxUsername: row.roblox_username || '',
        taskName: row.task_name || '',

    function getStoredToken() {

    function storeToken(token) {

    }
    function clearToken() {
      try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) { }
    }

    function storePendingRef(token) {
      try { localStorage.setItem(REF_STORAGE_KEY, token); } catch (e) { }
    }
    function getPendingRef() {

    function beginLogin(returnHash, refToken) {
      try { sessionStorage.setItem(RETURN_HASH_KEY, returnHash || window.location.hash || '#/'); } catch (e) { }
      const ref = refToken || getPendingRef();
      window.location.href = EDGE_BASE + '/roblox-auth-start' + (ref ? ('?ref=' + encodeURIComponent(ref)) : '');
    }

    function takeReturnHash() {
      let target = '#/';
      try {
        const stored = sessionStorage.getItem(RETURN_HASH_KEY);
        if (stored) target = stored;
        sessionStorage.removeItem(RETURN_HASH_KEY);
      } catch (e) { }
      return target;
    }

    async function verifySession() {
      const token = getStoredToken();
      if (!token) { isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; hrMaxHierarchy = 0; return; }
      try {
        // Fire the session check and the onboarding check together instead of
        // waiting for the first to finish before starting the second - both
        // just need the bearer token, so this saves a full round trip on
        // every page load (meaningful when the API has to cold-start).
        const [res, onboardingResult] = await Promise.all([
          fetch(EDGE_BASE + '/hr-session', {
            headers: {
              Authorization: 'Bearer ' + token,
              'ngrok-skip-browser-warning': 'true'
            }
          }),
          loadMyOnboarding().catch(() => null)
        ]);
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.ok) {
          isHrAuthed = true;
          hrUsername = json.robloxUsername || '';
          hrRoles = json.roles || [];
          hrPermissions = json.permissions || [];
          hrMaxHierarchy = json.maxHierarchy || 0;
          needsOnboarding = onboardingResult ? onboardingResult.some(s => s.required && !s.completedAt) : false;
        } else {
          isHrAuthed = false;
          hrUsername = '';
          hrRoles = [];
          hrPermissions = [];
          hrMaxHierarchy = 0;
          needsOnboarding = false;
          clearToken();
        }
      } catch (e) {
        isHrAuthed = false;
        hrUsername = '';
        hrRoles = [];
        hrPermissions = [];
        hrMaxHierarchy = 0;
        needsOnboarding = false;
      }
    }

    async function refreshOnboardingNeed() {
      try {
        const steps = await loadMyOnboarding();
        needsOnboarding = steps.some(s => s.required && !s.completedAt);
      } catch (e) {
        needsOnboarding = false;
      }
    }

    async function callHrData(action, payload) {
      const token = getStoredToken();
      const res = await fetch(EDGE_BASE + '/hr-data', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + (token || ''),
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ action, payload: payload || {} })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.ok) {
        if (res.status === 401) { clearToken(); isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; hrMaxHierarchy = 0; }
        throw new Error((json && json.error) || 'That request failed.');
      }
      return json;
    }

    async function exportRequestsToXlsx(rows, sheetLabel) {
      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'PlayVerse Payment Log';
      workbook.created = new Date();

      const sheetName = (sheetLabel || 'Payments').slice(0, 31);
      const sheet = workbook.addWorksheet(sheetName, { views: [{ showGridLines: false }] });

      sheet.columns = [
        { width: 5 },
        { width: 26 },
        { width: 22 },
        { width: 20 },
        { width: 52 },
        { width: 12 },
        { width: 12 },
        { width: 12 },
        { width: 12 },
        { width: 14 }
      ];

      sheet.mergeCells('A1:J3');
      const banner = sheet.getCell('A1');
      banner.value = 'PlayVerse Payment Log';
      banner.font = { name: 'Arial', size: 20, bold: true, color: { argb: 'FFFFFFFF' } };
      banner.alignment = { vertical: 'middle', horizontal: 'left', indent: 2 };
      for (let r = 1; r <= 3; r++) {
        for (let c = 1; c <= 10; c++) {
          sheet.getCell(r, c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF171A21' } };
        }
      }

      sheet.mergeCells('A4:J4');
      const sub = sheet.getCell('A4');
      sub.value = `Exported ${new Date().toLocaleString()}, DevEx rate ${(DEVEX_RATE * 10000).toFixed(2)} USD per 10,000 Robux`;
      sub.font = { name: 'Arial', size: 10, italic: true, color: { argb: 'FF5B616E' } };

      const headerRowNum = 6;
      const headers = ['#', 'DEV RBLX USERNAME', 'PRODUCER', 'GAME', 'TASK/BUG TITLE', 'APPROVED', 'PAID', 'R$', 'USD', 'DATE'];
      const headerRow = sheet.getRow(headerRowNum);
      headers.forEach((h, i) => { headerRow.getCell(i + 1).value = h; });
      headerRow.eachCell(cell => {
        cell.font = { name: 'Arial', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF171A21' } };
        cell.alignment = { vertical: 'middle', horizontal: 'left' };
      });
      headerRow.height = 22;
      sheet.views = [{ state: 'frozen', ySplit: headerRowNum, showGridLines: false }];

      rows.forEach((d, i) => {
        const rowNum = headerRowNum + 1 + i;
        const isRobux = d.currency === 'ROBUX';
        const row = sheet.getRow(rowNum);
        row.getCell(1).value = i + 1;
        row.getCell(2).value = d.robloxUsername || '';
        row.getCell(3).value = d.requestedBy || '';
        row.getCell(4).value = d.game || '';
        row.getCell(5).value = d.taskName || '';
        row.getCell(6).value = true;
        row.getCell(7).value = !!d.paid;
        if (isRobux) {
          row.getCell(8).value = Number(d.payment) || 0;
          row.getCell(9).value = { formula: `IF(H${rowNum}="","",H${rowNum}*${DEVEX_RATE})` };
        } else {
          row.getCell(8).value = '';
          row.getCell(9).value = Number(d.payment) || 0;
        }
        row.getCell(10).value = new Date(d.createdAt || Date.now());
        row.getCell(10).numFmt = 'dd/mm/yyyy';
        row.getCell(8).numFmt = '#,##0';
        row.getCell(9).numFmt = '$#,##0.00';
        row.eachCell(cell => {
          cell.border = { bottom: { style: 'thin', color: { argb: 'FFE4E7ED' } } };
          cell.font = { name: 'Arial', size: 11 };
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `playverse-payments-${(sheetLabel || 'all').toLowerCase()}-${stamp}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function parseHashQuery() {

    async function initAuth() {
      // These two don't depend on each other (one hits the API, the other
      // talks to Supabase directly) so run them side by side rather than
      // waiting on one before starting the other.
      await Promise.all([verifySession(), loadAppData()]);
      authReady = true;
      route();

    async function hrSignOut() {
      const token = getStoredToken();
      if (token) {
        try {
          await fetch(EDGE_BASE + '/hr-session', {
            method: 'DELETE',
            headers: {
              Authorization: 'Bearer ' + token,
              'ngrok-skip-browser-warning': 'true'
            }
          });
        } catch (e) { }
      }
      clearToken();
      isHrAuthed = false;
      hrUsername = '';
      hrRoles = [];
      hrPermissions = [];
      hrMaxHierarchy = 0;
      window.location.hash = '#/';
    }

    const app = document.getElementById('app');

    async function handleAuthCallback() {
      app.innerHTML = `
    ${topbar()}
    <div class="gate-shell">
      <div class="gate-card">
        <div class="gate-icon">PV</div>
        <h2>Signing you in</h2>
        <p>Confirming your Roblox account.</p>
      </div>
    </div>`;

      const params = parseHashQuery();
      const err = params.get('error');
      const token = params.get('session');

      if (token) {
        storeToken(token);
        await verifySession();
      }

      if (isHrAuthed) {
        clearPendingRef();
        window.location.hash = takeReturnHash();
      } else {
        const fallbackErr = err || (token ? 'session_invalid' : null);
        window.location.hash = '#/hr' + (fallbackErr ? ('?error=' + encodeURIComponent(fallbackErr)) : '');
      }
    }

    function route() {
      if (!authReady) return;
      renderGen++;
      const path = window.location.hash.split('?')[0];
      if (path === '#/auth-callback') { handleAuthCallback(); return; }

      if (path.indexOf('#/join/') === 0) {
        const token = decodeURIComponent(path.slice('#/join/'.length));
        handleJoinLink(token);
        return;
      }

      if (isHrAuthed && needsOnboarding && path !== '#/onboarding' && path !== '#/tos' && path !== '#/aup') {
        window.location.hash = '#/onboarding';
        return;
      }

      if (path === '#/tos') {
        if (isHrAuthed) renderPolicyPage('tos'); else renderHrGate();
      } else if (path === '#/aup') {
        if (isHrAuthed) renderPolicyPage('aup'); else renderHrGate();
      } else if (path === '#/hr' || path === '#/dashboard') {
        if (isHrAuthed) renderDashboard(); else renderHrGate();
      } else if (path === '#/manage') {
        if (isHrAuthed) renderManagePanel(); else renderHrGate();
      } else if (path === '#/analytics') {
        if (isHrAuthed) renderAnalytics(); else renderHrGate();
      } else if (path === '#/my') {
        if (isHrAuthed) renderMyPayments(); else renderHrGate();
      } else if (path === '#/new') {
        if (isHrAuthed && canSubmitRequests()) renderCreateView(); else if (isHrAuthed) renderMyPayments(); else renderHrGate();
      } else if (path === '#/onboarding') {
        if (isHrAuthed) renderOnboarding(); else renderHrGate();
      } else if (path === '#/staff') {
        if (isHrAuthed) renderStaffDatabase(); else renderHrGate();
      } else {
        if (isHrAuthed) {
          renderMyPayments();
        } else {
          renderHrGate();
        }
      }
    }
    window.addEventListener('hashchange', route);
    initAuth();

        base_access_check_failed: 'Could not verify your Roblox group membership, please try again.',
        not_eligible: 'You need to be in the required Roblox group, at the right rank, to use this tool.',
        account_banned: 'This account has been banned from the tool and cannot sign in again.'
      };
      const message = err ? (errorMessages[err] || 'Could not sign you in, please try again.') : null;

      app.innerHTML = `
    ${topbar()}
    <div class="gate-shell">
      <div class="gate-card">
        <div class="gate-icon">PV</div>
        <h2>Sign in</h2>
        <p>Sign in with your Roblox account. You'll need to be in the studio group at the required rank. What you can do here depends on the role tied to your rank or account.</p>
        ${configError ? `<div class="error-box"><span>${esc(configError)}</span></div>` : ''}
        ${message ? `<div class="error-box"><span>${esc(message)}</span></div>` : ''}
        <button class="btn btn-primary roblox-btn" id="robloxSignInBtn" ${configError ? 'disabled' : ''}>
          Sign in with Roblox
        </button>
        <div class="gate-note">You need a Roblox account and studio group access at the required rank to use this tool.</div>
      </div>
    </div>`;

      wireTopbarSignOut();
      const btn = document.getElementById('robloxSignInBtn');
      if (btn) btn.addEventListener('click', () => beginLogin('#/dashboard'));
    }

    async function handleJoinLink(token) {
      storePendingRef(token);

      app.innerHTML = `${topbar()}<div class="gate-shell"><div class="gate-card"><div class="gate-icon">PV</div><h2>Loading your invite...</h2></div></div>`;

      let info = null;
      let loadFailed = false;
      try {
        info = await fetchOnboardingLinkPreview(token);
      } catch (e) {
        loadFailed = true;
      }

      if (isHrAuthed) {
        let joining = false;
        let joinError = null;

        const renderInvite = () => {
          app.innerHTML = `
    ${topbar()}
    <div class="gate-shell">
      <div class="gate-card">
        <div class="gate-icon">PV</div>
        <h2>You've been invited</h2>
        ${loadFailed
              ? `<div class="error-box"><span>This invite link is invalid or has expired.</span></div>`
              : `
          <p>Click join to add this team and skillset to your account.</p>
          <div style="display:flex;flex-direction:column;gap:10px;margin:16px 0;">
            ${info && info.team ? `<div class="panel" style="margin:0;padding:14px 16px;"><div class="preview-label" style="margin-bottom:4px;">Team</div><strong style="color:${esc(info.team.color || 'var(--ink)')};">${esc(info.team.name)}</strong></div>` : ''}
            ${info && info.skillset ? `<div class="panel" style="margin:0;padding:14px 16px;"><div class="preview-label" style="margin-bottom:4px;">Skillset</div><strong style="color:${esc(info.skillset.color || 'var(--ink)')};">${esc(info.skillset.name)}</strong></div>` : ''}
          </div>`}
        ${joinError ? `<div class="error-box"><span>${esc(joinError)}</span></div>` : ''}
        ${!loadFailed ? `<button class="btn btn-primary" id="joinTeamBtn" ${joining ? 'disabled' : ''}>${joining ? 'Joining...' : 'Join'}</button>` : ''}
      </div>
    </div>`;
          wireTopbarSignOut();
          const btn = document.getElementById('joinTeamBtn');
          if (btn) btn.addEventListener('click', async () => {
            joining = true; joinError = null; renderInvite();
            try {
              await claimOnboardingLinkToken(token);
              clearPendingRef();
              window.location.hash = '#/onboarding';
            } catch (e) {
              joining = false;
              joinError = "Could not apply that invite link. It may be invalid or expired.";
              renderInvite();
            }
          });
        };

        renderInvite();
        return;
      }

      app.innerHTML = `
    ${topbar()}
    <div class="gate-shell">
      <div class="gate-card">
        <div class="gate-icon">PV</div>
        <h2>You've been invited</h2>
        ${loadFailed
          ? `<div class="error-box"><span>This invite link is invalid or has expired. You can still sign in normally.</span></div>`
          : `
          <p>Sign in with Roblox to finish setting up your account.</p>
          <div style="display:flex;flex-direction:column;gap:10px;margin:16px 0;">
            ${info && info.team ? `<div class="panel" style="margin:0;padding:14px 16px;"><div class="preview-label" style="margin-bottom:4px;">Team</div><strong style="color:${esc(info.team.color || 'var(--ink)')};">${esc(info.team.name)}</strong></div>` : ''}
            ${info && info.skillset ? `<div class="panel" style="margin:0;padding:14px 16px;"><div class="preview-label" style="margin-bottom:4px;">Skillset</div><strong style="color:${esc(info.skillset.color || 'var(--ink)')};">${esc(info.skillset.name)}</strong></div>` : ''}
          </div>`}
        ${configError ? `<div class="error-box"><span>${esc(configError)}</span></div>` : ''}
        <button class="btn btn-primary roblox-btn" id="joinSignInBtn" ${configError ? 'disabled' : ''}>Sign in with Roblox</button>
        <div class="gate-note">Signing in will assign you to this team and skillset automatically.</div>
      </div>
    </div>`;

      wireTopbarSignOut();
      const btn = document.getElementById('joinSignInBtn');
      if (btn) btn.addEventListener('click', () => beginLogin('#/onboarding', token));
    }

    function renderDashboard() {
      if (!hasPermission('dashboard.view')) { window.location.hash = hasPermission('settings.manage_games') || hasPermission('settings.manage_rate') || hasPermission('settings.manage_groups') || hasPermission('settings.manage_base_access') || hasPermission('roles.manage') || hasPermission('settings.manage_onboarding') ? '#/manage' : '#/'; return; }
      const myGen = renderGen;
      let allRequests = [];
      let filter = 'pending';
      let search = '';
      let roleFilter = 'all';
      let teamFilter = 'all';
      let skillsetFilter = 'all';
      let expanded = new Set();
      let loading = true;
      let loadError = null;
      let eligibilityCache = {};
      let eligibilityLoading = new Set();

      const canMarkPaid = hasPermission('dashboard.mark_paid');
      const canExport = hasPermission('dashboard.export');

      function getAllRoles() {
        const roles = new Set();
        allRequests.forEach(r => (r.requesterRoles || []).forEach(role => roles.add(role)));
        return Array.from(roles).sort();
      }

      function getAllTeams() {
        const teams = new Set();
        allRequests.forEach(r => { if (r.requesterTeam) teams.add(r.requesterTeam); });
        return Array.from(teams).sort();
      }

      function getAllSkillsets() {
        const skillsets = new Set();
        allRequests.forEach(r => { if (r.requesterSkillset) skillsets.add(r.requesterSkillset); });
        return Array.from(skillsets).sort();
      }

      function getRows() {
        let rows = allRequests.filter(r => filter === 'all' ? true : r.status === filter);
        if (roleFilter !== 'all') {
          rows = rows.filter(r => (r.requesterRoles || []).includes(roleFilter));
        }
        if (teamFilter !== 'all') {
          rows = rows.filter(r => r.requesterTeam === teamFilter);
        }
        if (skillsetFilter !== 'all') {
          rows = rows.filter(r => r.requesterSkillset === skillsetFilter);
        }
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          rows = rows.filter(r => (r.robloxUsername || '').toLowerCase().includes(q) || (r.taskName || '').toLowerCase().includes(q) || (r.game || '').toLowerCase().includes(q) || (r.requestedBy || '').toLowerCase().includes(q));
        }
        return rows;
      }

      function renderRow(r) {
        const items = parseWorkLines(r.workRaw || '');
        const isOpen = expanded.has(r.id);
        const statusLabel = r.status === 'paid' ? `Paid ${esc(fmtDate(r.paidAt || Date.now()))}` : r.status === 'rejected' ? 'Rejected' : 'Pending';
        const rowHtml = `
            <tr>
              <td><button class="expand-toggle" data-toggle="${esc(r.id)}">${isOpen ? '&minus;' : '+'}</button></td>
              <td class="id-cell mono">${esc(r.id)}</td>
              <td class="name-cell"><strong>${esc(r.requestedBy || '-')}</strong><span>${esc(r.robloxUsername || '-')}</span>${(r.requesterTeam || r.requesterSkillset) ? `<div class="role-meta" style="margin-top:2px;">${[r.requesterTeam, r.requesterSkillset].filter(Boolean).map(esc).join(' &middot; ')}</div>` : ''}${r.paymentMethod ? `<div class="method-note has-method">${esc(methodDisplayLabel(r.paymentMethod))}</div>` : `<div class="method-note missing-method">No payment method set</div>`}</td>
              <td class="task-cell"><div class="task-name">${esc(r.taskName || 'Untitled task')}</div><div class="task-count">${items.length} item${items.length === 1 ? '' : 's'}</div></td>
              <td>${r.game ? `<span class="game-badge" style="background:${gameColor(r.game)};">${esc(r.game)}</span>` : `<span class="empty-note">-</span>`}</td>
              <td>${esc(r.timeWorked || '-')}</td>
              <td class="pay-cell">${fmtAmount(r)}${r.currency === 'ROBUX' ? `<div style="font-weight:500;color:var(--muted);font-size:11px;margin-top:2px;">${devexEquivalent(r)}</div>` : ''}</td>
              <td><span class="status-chip ${r.status}">${statusLabel}</span>${r.status === 'rejected' && r.statusNote ? `<div class="status-note">${esc(r.statusNote)}</div>` : ''}</td>
              <td class="mono" style="white-space:nowrap;color:var(--muted);font-size:11.5px;">${esc(fmtDate(r.createdAt || Date.now()))}</td>
              <td class="actions-cell">
                ${r.status === 'pending' && canMarkPaid ? `<button class="btn btn-ok btn-sm" data-paid="${esc(r.id)}">Mark paid</button>` : ''}
                ${r.status === 'pending' && canMarkPaid ? `<button class="btn btn-ghost btn-sm" data-reject="${esc(r.id)}">Reject</button>` : ''}
                ${r.status !== 'pending' && canMarkPaid ? `<button class="btn btn-ghost btn-sm" data-reopen="${esc(r.id)}">Reopen</button>` : ''}
                ${canMarkPaid ? `<button class="btn btn-ghost btn-sm" data-delete-request="${esc(r.id)}">Delete Request</button>` : ''}
              </td>
            </tr>`;
        const cacheEntry = eligibilityCache[r.robloxUsername];
        const isElLoading = eligibilityLoading.has(r.robloxUsername);
        const detailHtml = isOpen ? `
            <tr class="detail-row">
              <td colspan="10">
                ${items.length ? `<ol class="detail-list">${items.map(i => `<li>${esc(i.lead)}${i.rest ? ' ' + esc(i.rest) : ''}</li>`).join('')}</ol>` : `<div class="detail-empty">No work items listed.</div>`}
                <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px;">
                  <div style="font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.6px;margin-bottom:8px;">Payout eligibility</div>
                  ${cacheEntry ? renderEligibilityList(cacheEntry) : (canSubmitRequests() ? `<button class="btn btn-ghost btn-sm" data-check-elig="${esc(r.robloxUsername)}" ${isElLoading ? 'disabled' : ''}>${isElLoading ? 'Checking...' : 'Check eligibility'}</button>` : `<div class="empty-note">You don't have permission to check eligibility.</div>`)}
                </div>
              </td>
            </tr>` : '';
        return rowHtml + detailHtml;
      }

      function renderEligibilityList(list) {
        if (!list.length) return `<div class="empty-note">No eligibility groups configured yet.</div>`;
        const allEligible = list.every(g => g.eligible);
        const isOverridden = list.some(g => g.overridden);
        return `
            ${isOverridden ? `<div class="hint" style="display:block;margin-bottom:8px;color:var(--muted);">"Ignore Eligibility for All Requests" is on, everyone is treated as eligible regardless of the status below.</div>` : ''}
            <div class="elig-summary ${allEligible ? 'is-ok' : ''}">${allEligible ? 'Eligible' : 'Not yet eligible'}</div>
            ${list.map(g => `
              <div class="elig-row">
                <div class="elig-left">
                  <div class="elig-check ${g.eligible ? 'is-ok' : ''}">${g.eligible ? '&#10003;' : '&middot;'}</div>
                  <div>
                    <div class="elig-name">${esc(g.name)}</div>
                    <div class="elig-meta">${g.metaLabel ? esc(g.metaLabel) : (g.isMember ? 'Member' : 'Not a member')}</div>
                  </div>
                </div>
              </div>`).join('')}`;
      }

      function tableHtml() {
        const rows = getRows();
        return loading ? `<div class="dash-loading">Loading payment requests...</div>` : loadError ? `
          <div class="dash-empty"><h3>Could not load requests</h3><p>${esc(loadError)}</p><button class="btn btn-ghost btn-sm" id="retryBtn">Try again</button></div>
        ` : rows.length === 0 ? `
          <div class="dash-empty"><h3>Nothing here</h3><p>No matching payment requests.</p></div>
        ` : `
        <div class="table-scroll">
          <table class="req-table">
            <thead>
              <tr>
                <th></th>
                <th>ID</th>
                <th>Requested by</th>
                <th>Task</th>
                <th>Game</th>
                <th>Time worked</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => renderRow(r)).join('')}
            </tbody>
          </table>
        </div>`;
      }

      function wireTableEvents() {
        const retryBtn = document.getElementById('retryBtn');
        if (retryBtn) retryBtn.addEventListener('click', () => { load(); });

        document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.toggle;
          if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
          paintTable();
        }));

        document.querySelectorAll('[data-check-elig]').forEach(b => b.addEventListener('click', async (e) => {
          const username = b.dataset.checkElig;
          eligibilityLoading.add(username);
          paintTable();
          try {
            const data = await getUserEligibility(username);
            eligibilityCache[username] = data;
          } catch (err) {
            eligibilityCache[username] = [];
          }
          eligibilityLoading.delete(username);
          paintTable();
        }));

        document.querySelectorAll('[data-paid]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.paid;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Saving...';
          try {
            r.paid = true;
            r.status = 'paid';
            r.paidAt = Date.now();
            await updateRequest(r);
            paintShell();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Mark paid';
            alert('Could not save. Check your connection and try again.');
          }
        }));

        document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.reject;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          const note = prompt('Reason for rejecting this request (optional):', '') || '';
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Saving...';
          try {
            r.status = 'rejected';
            r.statusNote = note;
            r.paid = false;
            r.paidAt = null;
            await rejectRequest(id, note);
            paintShell();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Reject';
            alert('Could not save. Check your connection and try again.');
          }
        }));

        document.querySelectorAll('[data-reopen]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.reopen;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Saving...';
          try {
            r.status = 'pending';
            r.statusNote = '';
            r.paid = false;
            r.paidAt = null;
            await reopenRequest(id);
            paintShell();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Reopen';
            alert('Could not save. Check your connection and try again.');
          }
        }));

        document.querySelectorAll('[data-delete-request]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.deleteRequest;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          if (!confirm('Permanently delete this payment request? This cannot be undone.')) return;
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Deleting...';
          try {
            await deleteRequest(id);
            allRequests = allRequests.filter(x => x.id !== id);
            paintShell();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Delete Request';
            alert('Could not delete that request. Check your connection and try again.');
          }
        }));
      }

      function paintTable() {
        const area = document.getElementById('reqTableArea');
        if (area) area.innerHTML = tableHtml();
        wireTableEvents();
      }

      function paintShell() {
        const counts = {
          all: allRequests.length,
          pending: allRequests.filter(r => r.status === 'pending').length,
          paid: allRequests.filter(r => r.status === 'paid').length,
          rejected: allRequests.filter(r => r.status === 'rejected').length
        };
        const pendingRows = allRequests.filter(r => r.status === 'pending');
        const missingMethodCount = pendingRows.filter(r => !r.paymentMethod).length;
        const pendingRobux = pendingRows.filter(r => r.currency === 'ROBUX').reduce((sum, r) => sum + (Number(r.payment) || 0), 0);
        const pendingUsd = pendingRows.filter(r => r.currency === 'USD').reduce((sum, r) => sum + (Number(r.payment) || 0), 0);
        const now = new Date();
        const paidThisMonth = allRequests.filter(r => r.status === 'paid' && r.paidAt && new Date(r.paidAt).getMonth() === now.getMonth() && new Date(r.paidAt).getFullYear() === now.getFullYear()).length;

        app.innerHTML = `
    ${topbar()}
    <div class="dash-shell">
      <div class="dash-head">
        <div>
          <span class="eyebrow">HR dashboard</span>
          <h1 style="margin-bottom:4px;">Payment requests</h1>
          <p class="sub">Everyone on the team sees the same list, updates save right away.</p>
        </div>
        <div class="dash-toolbar">
          ${canSubmitRequests() ? `<a class="btn btn-ghost btn-sm" href="#/new">New request</a>` : ''}
          ${canSeeAnalytics() ? `<a class="btn btn-ghost btn-sm" href="#/analytics">Analytics</a>` : ''}
          ${hasPermission('staff.view_database') ? `<a class="btn btn-ghost btn-sm" href="#/staff">Staff database</a>` : ''}
          ${(hasPermission('settings.manage_games') || hasPermission('settings.manage_rate') || hasPermission('settings.manage_groups') || hasPermission('settings.manage_base_access') || hasPermission('roles.manage') || hasPermission('settings.manage_onboarding')) ? `<a class="btn btn-ghost btn-sm" href="#/manage">Manage</a>` : ''}
          <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
          ${canExport ? `<button class="btn btn-ghost btn-sm" id="copyAllBtn">Copy all as spreadsheet rows</button><button class="btn btn-ok btn-sm" id="exportXlsxBtn">Export as spreadsheet (.xlsx)</button>` : ''}
        </div>
      </div>

      <div class="stat-strip">
        <div class="strip-card">
          <div class="strip-label">Pending Robux</div>
          <div class="strip-value"><img src="${ROBUX_IMG}" alt="Robux">${pendingRobux.toLocaleString()}</div>
        </div>
        <div class="strip-card">
          <div class="strip-label">Pending USD</div>
          <div class="strip-value">$${pendingUsd.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
        </div>
        <div class="strip-card">
          <div class="strip-label">Paid this month</div>
          <div class="strip-value">${paidThisMonth}</div>
        </div>
        <div class="strip-card">
          <div class="strip-label">Missing payment method</div>
          <div class="strip-value" style="${missingMethodCount > 0 ? 'color:var(--warn-text);' : ''}">${missingMethodCount}</div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="tabs">
          <button class="tab-btn ${filter === 'all' ? 'active' : ''}" data-filter="all">All (${counts.all})</button>
          <button class="tab-btn ${filter === 'pending' ? 'active' : ''}" data-filter="pending">Pending (${counts.pending})</button>
          <button class="tab-btn ${filter === 'paid' ? 'active' : ''}" data-filter="paid">Paid (${counts.paid})</button>
          <button class="tab-btn ${filter === 'rejected' ? 'active' : ''}" data-filter="rejected">Rejected (${counts.rejected})</button>
        </div>
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="Search by username, task, or game" value="${esc(search)}">
        </div>
        <div class="filter-select-group">
          ${getAllTeams().length ? `
          <select id="teamFilterSelect" class="filter-select">
            <option value="all" ${teamFilter === 'all' ? 'selected' : ''}>All teams</option>
            ${getAllTeams().map(t => `<option value="${esc(t)}" ${teamFilter === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
          </select>` : ''}
          ${getAllSkillsets().length ? `
          <select id="skillsetFilterSelect" class="filter-select">
            <option value="all" ${skillsetFilter === 'all' ? 'selected' : ''}>All skillsets</option>
            ${getAllSkillsets().map(s => `<option value="${esc(s)}" ${skillsetFilter === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
          </select>` : ''}
          ${getAllRoles().length ? `
          <select id="roleFilterSelect" class="filter-select">
            <option value="all" ${roleFilter === 'all' ? 'selected' : ''}>All roles</option>
            ${getAllRoles().map(r => `<option value="${esc(r)}" ${roleFilter === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
          </select>` : ''}
        </div>
      </div>

      <div class="table-wrap" id="reqTableArea">${tableHtml()}</div>
      <div class="footer-note">Data is stored in a database and shared across everyone using this tool.</div>
    </div>`;

        wireTopbarSignOut();
        wireTableEvents();

        document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { filter = b.dataset.filter; paintShell(); }));

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('input', () => { search = searchInput.value; paintTable(); });
        }

        const roleFilterSelect = document.getElementById('roleFilterSelect');
        if (roleFilterSelect) {
          roleFilterSelect.addEventListener('change', () => { roleFilter = roleFilterSelect.value; paintTable(); });
        }

        const teamFilterSelect = document.getElementById('teamFilterSelect');
        if (teamFilterSelect) {
          teamFilterSelect.addEventListener('change', () => { teamFilter = teamFilterSelect.value; paintTable(); });
        }

        const skillsetFilterSelect = document.getElementById('skillsetFilterSelect');
        if (skillsetFilterSelect) {
          skillsetFilterSelect.addEventListener('change', () => { skillsetFilter = skillsetFilterSelect.value; paintTable(); });
        }

        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', () => { load(); });

        const copyAllBtn = document.getElementById('copyAllBtn');
        if (copyAllBtn) copyAllBtn.addEventListener('click', (e) => {
          const tsv = [TSV_HEADER, ...getRows().map(rowToTSV)].join('\n');
          copyText(tsv, e.currentTarget, 'Copied table!');
        });

        const exportXlsxBtn = document.getElementById('exportXlsxBtn');
        if (exportXlsxBtn) exportXlsxBtn.addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          const original = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Building file...';
          try {
            await exportRequestsToXlsx(getRows(), filter);
          } catch (err) {
            alert('Could not build the spreadsheet. Please try again.');
          } finally {
            btn.disabled = false;
            btn.textContent = original;
          }
        });
      }

      async function load() {
        loading = true; loadError = null; paintShell();
        try {
          allRequests = await loadAllRequests();
        } catch (err) {
          loadError = (err && err.message) ? err.message : 'Something went wrong while reading the shared request list.';
        }
        if (myGen !== renderGen) return; // navigated away while this was loading
        loading = false;
        paintShell();
      }

      load();
    }

    const AN_PALETTE = ['#3730D9', '#178A4C', '#B3311C', '#8A6300', '#0EA5E9', '#DB2777', '#65A30D', '#7C3AED', '#EA580C', '#0D9488'];

    function renderAnalytics() {
      if (!canSeeAnalytics()) { window.location.hash = hasPermission('dashboard.view') ? '#/dashboard' : '#/'; return; }
      const myGen = renderGen;

      let allRequests = [];
      let loading = true;
      let loadError = null;

      let statusFilter = 'all';
      let gameFilter = 'all';
      let teamFilter = 'all';
      let skillsetFilter = 'all';
      let roleFilter = 'all';
      let currencyFilter = 'all';
      let personFilter = '';
      let dateFrom = '';
      let dateTo = '';
      let search = '';
      let groupBy = 'game';

      let exploreChartInstance = null;

      let chartMetric = 'paid_usd';
      let chartInterval = 'day';
      let chartBreakdown = 'none';
      let chartType = 'line';
      let chartSmoothing = 'none';
      let chartOverlay = 'none';
      let chartRange = '56';

      const METRICS = {
        paid_usd: { label: 'Paid amount', unit: 'usd', dateField: 'paidAt', match: r => r.status === 'paid', value: r => usdEquivalent(r) },
        pending_usd: { label: 'Pending amount', unit: 'usd', dateField: 'createdAt', match: r => r.status === 'pending', value: r => usdEquivalent(r) },
        tasks_completed: { label: 'Tasks completed', unit: 'count', dateField: 'paidAt', match: r => r.status === 'paid', value: () => 1 },
        requests_submitted: { label: 'Requests submitted', unit: 'count', dateField: 'createdAt', match: () => true, value: () => 1 },
        avg_payment: { label: 'Average payment', unit: 'usd', dateField: 'paidAt', match: r => r.status === 'paid', value: r => usdEquivalent(r), isAverage: true }
      };

      const BREAKDOWN_DIMS = {
        none: { label: 'None', fn: null },
        game: { label: 'Game', fn: r => [r.game || '(no game)'] },
        team: { label: 'Team', fn: r => splitList(r.requesterTeam).length ? splitList(r.requesterTeam) : ['(no team)'] },
        skillset: { label: 'Skillset', fn: r => splitList(r.requesterSkillset).length ? splitList(r.requesterSkillset) : ['(no skillset)'] },
        role: { label: 'Role', fn: r => (r.requesterRoles && r.requesterRoles.length) ? r.requesterRoles : ['(no role)'] },
        user: { label: 'Person', fn: r => [r.robloxUsername || '(unknown)'] }
      };

      const CHART_TYPES = [
        { key: 'line', label: 'Line chart' },
        { key: 'hbar', label: 'Horizontal bar' },
        { key: 'stacked', label: 'Stacked column' },
        { key: 'pie', label: 'Pie chart' },
        { key: 'table', label: 'Table' }
      ];

      const CHART_RANGES = [
        { key: '7', label: 'Last 7 days' },
        { key: '14', label: 'Last 14 days' },
        { key: '30', label: 'Last 30 days' },
        { key: '56', label: 'Last 56 days' },
        { key: '90', label: 'Last 90 days' },
        { key: 'all', label: 'All time' }
      ];

      function usdEquivalent(r) {
        const amt = Number(r.payment) || 0;
        return r.currency === 'USD' ? amt : amt * DEVEX_RATE;
      }

      function fmtUsd(n) {
        return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function fmtRobux(n) {
        return Math.round(n).toLocaleString();
      }

      function splitList(str) {
        return str ? String(str).split(',').map(s => s.trim()).filter(Boolean) : [];
      }

      function getAllGames() {
        return Array.from(new Set(allRequests.map(r => r.game).filter(Boolean))).sort();
      }
      function getAllTeams() {
        const set = new Set();
        allRequests.forEach(r => splitList(r.requesterTeam).forEach(t => set.add(t)));
        return Array.from(set).sort();
      }
      function getAllSkillsets() {
        const set = new Set();
        allRequests.forEach(r => splitList(r.requesterSkillset).forEach(s => set.add(s)));
        return Array.from(set).sort();
      }
      function getAllRoles() {
        const set = new Set();
        allRequests.forEach(r => (r.requesterRoles || []).forEach(role => set.add(role)));
        return Array.from(set).sort();
      }
      function getAllUsers() {
        return Array.from(new Set(allRequests.map(r => r.robloxUsername).filter(Boolean))).sort((a, b) => a.localeCompare(b));
      }

      function getFilteredRows() {
        let rows = allRequests.slice();
        if (statusFilter !== 'all') rows = rows.filter(r => r.status === statusFilter);
        if (gameFilter !== 'all') rows = rows.filter(r => r.game === gameFilter);
        if (teamFilter !== 'all') rows = rows.filter(r => splitList(r.requesterTeam).includes(teamFilter));
        if (skillsetFilter !== 'all') rows = rows.filter(r => splitList(r.requesterSkillset).includes(skillsetFilter));
        if (roleFilter !== 'all') rows = rows.filter(r => (r.requesterRoles || []).includes(roleFilter));
        if (currencyFilter !== 'all') rows = rows.filter(r => r.currency === currencyFilter);
        if (personFilter.trim()) { const pq = personFilter.trim().toLowerCase(); rows = rows.filter(r => (r.robloxUsername || '').toLowerCase().includes(pq)); }
        if (dateFrom) { const from = new Date(dateFrom).getTime(); rows = rows.filter(r => (r.createdAt || 0) >= from); }
        if (dateTo) { const to = new Date(dateTo).getTime() + 24 * 60 * 60 * 1000 - 1; rows = rows.filter(r => (r.createdAt || 0) <= to); }
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          rows = rows.filter(r => (r.robloxUsername || '').toLowerCase().includes(q) || (r.taskName || '').toLowerCase().includes(q) || (r.game || '').toLowerCase().includes(q) || (r.requestedBy || '').toLowerCase().includes(q));
        }
        return rows;
      }

      function computeBreakdown(rows, dimension) {
        const map = new Map();
        rows.forEach(r => {
          let labels;
          if (dimension === 'game') labels = [r.game || '(no game)'];
          else if (dimension === 'user') labels = [r.robloxUsername || '(unknown)'];
          else if (dimension === 'team') labels = splitList(r.requesterTeam).length ? splitList(r.requesterTeam) : ['(no team)'];
          else if (dimension === 'skillset') labels = splitList(r.requesterSkillset).length ? splitList(r.requesterSkillset) : ['(no skillset)'];
          else labels = (r.requesterRoles && r.requesterRoles.length) ? r.requesterRoles : ['(no role)'];
          const amt = usdEquivalent(r);
          const robuxAmt = r.currency === 'ROBUX' ? (Number(r.payment) || 0) : 0;
          const usdAmt = r.currency === 'USD' ? (Number(r.payment) || 0) : 0;
          labels.forEach(l => {
            const cur = map.get(l) || { amount: 0, robux: 0, usd: 0, count: 0 };
            cur.amount += amt;
            cur.robux += robuxAmt;
            cur.usd += usdAmt;
            cur.count += 1;
            map.set(l, cur);
          });
        });
        return Array.from(map.entries()).map(([label, v]) => ({ label, ...v })).sort((a, b) => b.amount - a.amount);
      }

      function computeOwed(rows) {
        const map = new Map();
        rows.filter(r => r.status === 'pending').forEach(r => {
          const cur = map.get(r.robloxUsername) || { robux: 0, usd: 0, count: 0, paymentMethod: null };
          if (r.currency === 'ROBUX') cur.robux += Number(r.payment) || 0; else cur.usd += Number(r.payment) || 0;
          cur.count += 1;
          // rows arrive newest-first, so the first request we see for a person
          // reflects their current payment method rather than an old one.
          if (!cur.paymentMethod && r.paymentMethod) cur.paymentMethod = r.paymentMethod;
          map.set(r.robloxUsername, cur);
        });
        return Array.from(map.entries()).map(([user, v]) => ({ user, ...v, total: v.robux * DEVEX_RATE + v.usd })).sort((a, b) => b.total - a.total);
      }

      function computeEarnings(rows) {
        const map = new Map();
        rows.filter(r => r.status === 'paid').forEach(r => {
          const cur = map.get(r.robloxUsername) || { robux: 0, usd: 0, tasks: 0 };
          if (r.currency === 'ROBUX') cur.robux += Number(r.payment) || 0; else cur.usd += Number(r.payment) || 0;
          cur.tasks += 1;
          map.set(r.robloxUsername, cur);
        });
        return Array.from(map.entries()).map(([user, v]) => ({ user, ...v, total: v.robux * DEVEX_RATE + v.usd })).sort((a, b) => b.total - a.total);
      }

      const GROUP_LABELS = { game: 'game', skillset: 'skillset', role: 'role', team: 'team', user: 'person' };

      function bucketDate(ts, interval) {
        const d = new Date(ts);
        if (interval === 'week') {
          const monday = new Date(d);
          monday.setHours(0, 0, 0, 0);
          monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
          return { key: monday.toISOString().slice(0, 10), sort: monday.getTime(), label: monday.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) };
        }
        if (interval === 'month') {
          const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          return { key, sort: d.getFullYear() * 12 + d.getMonth(), label: d.toLocaleString(undefined, { month: 'short', year: '2-digit' }) };
        }
        const day = new Date(d); day.setHours(0, 0, 0, 0);
        return { key: day.toISOString().slice(0, 10), sort: day.getTime(), label: day.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) };
      }

      function fmtMetric(metric, n) {
        return metric.unit === 'usd' ? fmtUsd(n) : Math.round(n).toLocaleString();
      }

      function movingAverage(data, window) {
        return data.map((_, i) => {
          const start = Math.max(0, i - window + 1);
          const slice = data.slice(start, i + 1);
          return slice.reduce((a, b) => a + b, 0) / slice.length;
        });
      }

      function chartRangeWindow() {
        if (chartRange === 'all') return null;
        const days = Number(chartRange);
        const to = Date.now();
        return { from: to - days * 24 * 60 * 60 * 1000, to };
      }

      function buildChartData(rows) {
        const metric = METRICS[chartMetric];
        const dim = BREAKDOWN_DIMS[chartBreakdown];
        let eligible = rows.filter(metric.match).filter(r => r[metric.dateField]);
        const win = chartRangeWindow();
        if (win) eligible = eligible.filter(r => r[metric.dateField] >= win.from && r[metric.dateField] <= win.to);

        let categories;
        if (!dim.fn) {
          categories = ['Total'];
        } else {
          const totals = new Map();
          eligible.forEach(r => dim.fn(r).forEach(l => totals.set(l, (totals.get(l) || 0) + metric.value(r))));
          const sorted = Array.from(totals.entries()).sort((a, b) => b[1] - a[1]).map(([l]) => l);
          categories = sorted.slice(0, 6);
          if (sorted.length > 6) categories = [...categories, 'Other'];
        }

        const bucketMap = new Map();
        eligible.forEach(r => {
          const b = bucketDate(r[metric.dateField], chartInterval);
          let entry = bucketMap.get(b.key);
          if (!entry) { entry = { sort: b.sort, label: b.label, cats: new Map() }; bucketMap.set(b.key, entry); }
          const labels = dim.fn ? dim.fn(r) : ['Total'];
          const val = metric.value(r);
          labels.forEach(l => {
            const catKey = categories.includes(l) ? l : (categories.includes('Other') ? 'Other' : null);
            if (!catKey) return;
            const cur = entry.cats.get(catKey) || { sum: 0, count: 0 };
            cur.sum += val; cur.count += 1;
            entry.cats.set(catKey, cur);
          });
        });

        const buckets = Array.from(bucketMap.values()).sort((a, b) => a.sort - b.sort);
        const labels = buckets.map(b => b.label);
        const series = categories.map(cat => ({
          label: cat,
          data: buckets.map(b => {
            const c = b.cats.get(cat);
            if (!c) return 0;
            return metric.isAverage ? (c.count ? c.sum / c.count : 0) : c.sum;
          })
        }));

        const totalsPerCat = categories.map(cat => {
          let sum = 0, count = 0;
          buckets.forEach(b => { const c = b.cats.get(cat); if (c) { sum += c.sum; count += c.count; } });
          return { label: cat, value: metric.isAverage ? (count ? sum / count : 0) : sum, count };
        });

        const overallValue = metric.isAverage
          ? (eligible.length ? eligible.reduce((s, r) => s + metric.value(r), 0) / eligible.length : 0)
          : eligible.reduce((s, r) => s + metric.value(r), 0);

        return { labels, series, categories, totalsPerCat, overallValue, eligibleCount: eligible.length };
      }

      function computePreviousPeriodSeries(bucketCount) {
        const win = chartRangeWindow();
        if (!win) return null;
        const span = win.to - win.from;
        const prevTo = win.from - 1;
        const prevFrom = prevTo - span;
        const metric = METRICS[chartMetric];
        const prevRows = allRequests.filter(metric.match).filter(r => r[metric.dateField] && r[metric.dateField] >= prevFrom && r[metric.dateField] <= prevTo);
        const bucketMap = new Map();
        prevRows.forEach(r => {
          const b = bucketDate(r[metric.dateField], chartInterval);
          const cur = bucketMap.get(b.key) || { sort: b.sort, sum: 0, count: 0 };
          cur.sum += metric.value(r); cur.count += 1;
          bucketMap.set(b.key, cur);
        });
        const buckets = Array.from(bucketMap.values()).sort((a, b) => a.sort - b.sort);
        const values = buckets.map(b => metric.isAverage ? (b.count ? b.sum / b.count : 0) : b.sum);
        const aligned = [];
        for (let i = 0; i < bucketCount; i++) aligned.push(values[i] !== undefined ? values[i] : 0);
        return aligned;
      }

      function renderChartTableHtml(chartData) {
        if (!chartData.labels.length) return `<div class="chart-empty">No data for this metric in the selected range.</div>`;
        const metric = METRICS[chartMetric];
        return `<div class="table-wrap an-table-wrap explore-table-wrap"><div class="table-scroll"><table class="an-table">
          <thead><tr><th>Period</th>${chartData.series.map(s => `<th class="num-cell">${esc(s.label)}</th>`).join('')}</tr></thead>
          <tbody>${chartData.labels.map((lab, i) => `<tr><td>${esc(lab)}</td>${chartData.series.map(s => `<td class="num-cell">${fmtMetric(metric, s.data[i])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div></div>`;
      }

              ${Object.entries(METRICS).map(([k, m]) => `<option value="${k}" ${chartMetric === k ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}

        </div>

      }
