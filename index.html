<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayVerse Payment Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    :root {
      --bg: #F5F6F8;
      --surface: #FFFFFF;
      --ink: #171A21;
      --ink-soft: #5B616E;
      --muted: #8A93A3;
      --line: #E4E7ED;
      --accent: #3730D9;
      --accent-soft: #EEEDFB;
      --warn-bg: #FFF7E6;
      --warn-line: #F1E4BC;
      --warn-text: #8A6300;
      --ok-bg: #E9F7EF;
      --ok-line: #C7E9D3;
      --ok-text: #178A4C;
      --err-bg: #FDEDEC;
      --err-line: #F5C6C0;
      --err-text: #B3311C;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: .1px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .brand small {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar a.link {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .topbar a.link:hover {
      color: var(--ink);
    }

    .hr-pill {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .hr-pill:hover {
      background: var(--bg);
    }

    .hr-pill .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok-text);
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .create-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width:900px) {
      .create-grid {
        grid-template-columns: 1fr;
      }
    }

    .heading-block {
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .sub {
      color: var(--ink-soft);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 54ch;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 7px;
      letter-spacing: .2px;
    }

    .field .hint {
      font-weight: 400;
      color: #9BA1AC;
      margin-left: 6px;
    }

    .field .err-hint {
      color: var(--err-text);
      font-size: 12px;
      margin-top: 5px;
    }

    input[type=text],
    input[type=number],
    input[type=password],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: #FCFCFD;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: #fff;
    }

    input.field-invalid,
    textarea.field-invalid,
    select.field-invalid {
      border-color: var(--err-line);
      background: var(--err-bg);
    }

    input:disabled {
      background: var(--bg);
      color: var(--ink-soft);
      cursor: not-allowed;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      border-radius: 9px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform .12s, box-shadow .12s, background .12s, opacity .12s;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background: #000;
    }

    .btn-ghost {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-ghost:hover {
      background: #E2E0FA;
    }

    .btn-ok {
      background: var(--ok-text);
      color: #fff;
    }

    .btn-ok:hover {
      background: #126B3B;
    }

    .btn-ok:disabled {
      background: var(--ok-bg);
      color: var(--ok-text);
      cursor: default;
      opacity: 1;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12.5px;
      border-radius: 7px;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .preview-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .invoice {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(20, 22, 30, .03), 0 8px 24px -14px rgba(20, 22, 30, .16);
      overflow: hidden;
    }

    .invoice-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 26px 32px 22px;
    }

    .doc-type {
      text-align: right;
    }

    .doc-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .doc-id {
      font-size: 13px;
      color: var(--ink);
      font-weight: 600;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 0;
    }

    .parties {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 20px 32px;
      gap: 20px;
    }

    .party-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .party-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .party-value.mono {
      font-size: 13px;
    }

    @media (max-width:640px) {
      .parties {
        grid-template-columns: 1fr 1fr;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr !important;
      }
    }

    .task-block {
      padding: 20px 32px;
      border-top: 1px solid var(--line);
    }

    .task-label {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 7px;
    }

    .task-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.2px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 4px 32px 20px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
    }

    .stat-card .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-card.stat-status .stat-value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .stat-card.stat-status.is-paid .stat-value {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .items-block {
      padding: 20px 32px 10px;
      border-top: 1px solid var(--line);
    }

    .items-head {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    .items-list {
      margin: 0;
      padding-left: 20px;
    }

    .items-list li {
      font-size: 13.8px;
      line-height: 1.7;
      color: #33363D;
      padding: 6px 0 6px 4px;
    }

    .items-list li::marker {
      color: var(--muted);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .items-list li .lead {
      font-weight: 600;
      color: var(--ink);
    }

    .empty-note {
      color: var(--muted);
      font-size: 13px;
      padding: 6px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 32px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .total-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .total-value {
      font-size: 25px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: -.3px;
    }

    .total-value .robux-icon {
      height: 1em;
      width: 1em;
      display: inline-block;
      object-fit: contain;
      flex-shrink: 0;
    }

    .invoice-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .foot-contact {
      font-size: 12px;
      color: var(--muted);
    }

    .confirm-box {
      background: var(--ok-bg);
      border: 1px solid var(--ok-line);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .confirm-box .icon {
      font-size: 18px;
      line-height: 1;
    }

    .confirm-box .txt strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 3px;
    }

    .confirm-box .txt span {
      color: var(--ink-soft);
      font-size: 13px;
    }

    .error-box {
      background: var(--err-bg);
      border: 1px solid var(--err-line);
      color: var(--err-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .warn-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gate-shell {
      max-width: 400px;
      margin: 90px auto;
      padding: 0 20px;
    }

    .gate-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px 28px;
      text-align: center;
    }

    .gate-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .gate-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .gate-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .gate-card .field {
      text-align: left;
    }

    .gate-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .roblox-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .roblox-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .lock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 26, 33, .55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .lock-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px -20px rgba(20, 22, 30, .45);
    }

    .lock-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .lock-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .lock-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .lock-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .dash-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .dash-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
    }

    .dash-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px;
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 12.5px;
      padding: 7px 13px;
      border-radius: 6px;
      color: var(--ink-soft);
    }

    .tab-btn.active {
      background: var(--ink);
      color: #fff;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table.req-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 1080px;
    }

    table.req-table thead th {
      text-align: left;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      padding: 11px 14px;
      background: #FAFAFB;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    table.req-table tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    table.req-table tbody tr:last-child td {
      border-bottom: none;
    }

    table.req-table tbody tr:hover {
      background: #FBFBFD;
    }

    table.req-table td.id-cell {
      color: var(--muted);
      font-size: 11.5px;
    }

    table.req-table td.name-cell strong {
      display: block;
      color: var(--ink);
      font-size: 13.5px;
    }

    table.req-table td.name-cell span {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 2px;
    }

    table.req-table td.name-cell .method-note {
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
    }

    table.req-table td.name-cell .method-note.has-method {
      color: var(--ok-text);
    }

    table.req-table td.name-cell .method-note.missing-method {
      color: var(--warn-text);
    }

    table.req-table td.task-cell {
      max-width: 240px;
    }

    table.req-table td.task-cell .task-name {
      font-weight: 600;
      color: var(--ink);
    }

    table.req-table td.task-cell .task-count {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 2px;
    }

    table.req-table td.pay-cell {
      white-space: nowrap;
      font-weight: 700;
    }

    table.req-table td.pay-cell img {
      height: 1em;
      width: 1em;
      object-fit: contain;
      vertical-align: -0.08em;
      margin-right: 4px;
    }

    table.req-table td.actions-cell {
      white-space: nowrap;
    }

    table.req-table td.actions-cell .btn {
      margin-right: 6px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .status-chip.pending {
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .status-chip.paid {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .expand-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    tr.detail-row td {
      background: #FAFAFB;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
    }

    tr.detail-row .detail-list {
      margin: 0;
      padding-left: 18px;
      font-size: 12.8px;
      color: #33363D;
      line-height: 1.7;
    }

    tr.detail-row .detail-empty {
      color: var(--muted);
      font-size: 12.5px;
    }

    .dash-empty {
      text-align: center;
      padding: 70px 20px;
      color: var(--ink-soft);
    }

    .dash-empty h3 {
      color: var(--ink);
      font-size: 18px;
      margin-bottom: 6px;
    }

    .dash-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .footer-note {
      text-align: center;
      color: #A2A8B4;
      font-size: 12px;
      margin-top: 22px;

      DEVEX_ROBUX: { label: 'Robux', sub: 'Paid in Robux via the Roblox group(s)', fields: [{ key: 'robloxUsername', label: 'Roblox username to receive Robux', type: 'text', placeholder: 'Builderman' }] },
      VENMO: { label: 'Venmo', sub: 'Paid to your Venmo username', fields: [{ key: 'venmoUsername', label: 'Venmo username', type: 'text', placeholder: '@your-venmo' }] }

      if (!SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0) {
        configError = 'Supabase is not configured yet. Open this file and set SUPABASE_URL and SUPABASE_ANON_KEY near the top of the script.';
      } else if (!EDGE_BASE || EDGE_BASE.indexOf('YOUR-SERVER-DOMAIN') !== -1) {

      configError = 'Could not start the Supabase client. Double check SUPABASE_URL and SUPABASE_ANON_KEY.';

    const ROBUX_IMG = 'https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/e/a/9/ea98f8c6c438d2d8136a6751282a153c6b28b892.png';

    let DEVEX_RATE = 0.0038;

    let isHrAuthed = false;
    let hrUsername = '';
    let hrRoles = [];
    let hrPermissions = [];
    let authReady = false;
    let appDataReady = false;

    function hasPermission(permission) {
      return hrPermissions.includes(permission);
    }

    function canSubmitRequests() {
      return isHrAuthed && hasPermission('dashboard.submit_request');
    }

    function devexLabel() {
      const per10k = DEVEX_RATE * 10000;
      return `DevEx rate: $${per10k.toFixed(2)} per 10,000 Robux (${DEVEX_RATE})`;
    }

    function fmtAmount(data) {
      const isRobux = data.currency === 'ROBUX';
      const n = isRobux
        ? Number(data.payment || 0).toLocaleString()
        : Number(data.payment || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (isRobux) return `<img class="robux-icon" src="${ROBUX_IMG}" alt="Robux">${n}`;
      return `${CURRENCY_SYMBOL[data.currency] || ''}${n} ${data.currency}`;
    }

    function devexEquivalent(data) {
      if (data.currency !== 'ROBUX') return '';
      const usd = (Number(data.payment) || 0) * DEVEX_RATE;
      return `&asymp; $${usd.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD at DevEx`;
    }

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
      return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
    }
    function gameColor(name) {
      const s = String(name || '');
      let hash = 0;
      for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return hslToHex(hue, 65, 45);
    }

    function copyText(text, btn, label) {
      const done = () => flashBtn(btn, label || 'Copied!');
      const legacyCopy = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) done(); else flashBtn(btn, 'Select and copy');
        } catch (e) { flashBtn(btn, 'Select and copy'); }
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    function flashBtn(btn, msg) {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    function parseWorkLines(raw) {
      return String(raw || '')
        .split('\n')
        .map(l => l.trim().replace(/^->\s*/, '').replace(/^-\s*/, ''))
        .filter(Boolean)
        .map(text => {
          let lead = text, rest = '';
          const periodIdx = text.indexOf('. ');
          if (periodIdx !== -1) { lead = text.slice(0, periodIdx + 1); rest = text.slice(periodIdx + 2); }
          return { lead, rest };
        });
    }

    function renderInvoice(data) {
      const items = parseWorkLines(data.workRaw || '');
      const isPaid = !!data.paid;
      const listHtml = items.length
        ? `<ol class="items-list">${items.map(item => `
        <li><span class="lead">${esc(item.lead)}</span>${item.rest ? ` ${esc(item.rest)}` : ''}</li>`).join('')}</ol>`
        : `<div class="empty-note">No work items added yet.</div>`;

      return `
    <div class="invoice">
      <div class="invoice-top">
        <div class="brand"><span class="dot"></span>PlayVerse</div>
        <div class="doc-type">
          <div class="doc-label">Payment Request</div>
          <div class="doc-id mono">${esc(data.id)}</div>
        </div>
      </div>
      <hr class="divider">
      <div class="parties">
        <div><div class="party-label">Requested by</div><div class="party-value">${esc(data.requestedBy || '-')}</div></div>
        <div><div class="party-label">Roblox account</div><div class="party-value mono">${esc(data.robloxUsername || '-')}</div></div>
        <div><div class="party-label">Date logged</div><div class="party-value mono">${esc(fmtDate(data.createdAt || Date.now()))}</div></div>
      </div>
      <div class="task-block">
        <div class="task-label">Task</div>
        <div class="task-title">${esc(data.taskName || 'Untitled task')}</div>
        ${data.game ? `<div style="margin-top:9px;"><span class="game-badge" style="background:${gameColor(data.game)};">${esc(data.game)}</span></div>` : ''}
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Time worked</div><div class="stat-value">${esc(data.timeWorked || '-')}</div></div>
        <div class="stat-card"><div class="stat-label">Work items</div><div class="stat-value">${items.length}</div></div>
        <div class="stat-card stat-status${isPaid ? ' is-paid' : ''}"><div class="stat-label">Status</div><div class="stat-value">${isPaid ? `Paid ${esc(fmtDate(data.paidAt || Date.now()))}` : 'Pending'}</div></div>
      </div>
      <div class="items-block">
        <div class="items-head">Work completed</div>
        ${listHtml}
      </div>
      <div class="total-row">
        <div class="total-label">${isPaid ? 'Total Paid' : 'Total Due'}</div>
        <div style="text-align:right;">
          <div class="total-value">${fmtAmount(data)}</div>
          ${data.currency === 'ROBUX' ? `<div style="font-size:11.5px;color:var(--muted);margin-top:3px;">${devexEquivalent(data)}</div>` : ''}
        </div>
      </div>
      <div class="invoice-foot"><span class="foot-contact">${devexLabel()}</span></div>
    </div>`;
    }

    function rowToClient(row) {
      return {
        id: row.id,
        requestedBy: row.requested_by || '',
        robloxUsername: row.roblox_username || '',
        taskName: row.task_name || '',
        game: row.game || '',
        workRaw: row.work_raw || '',
        timeWorked: row.time_worked || '',
        payment: row.payment,
        currency: row.currency || 'ROBUX',
        paid: !!row.paid,
        status: row.status || (row.paid ? 'paid' : 'pending'),
        statusNote: row.status_note || '',
        paidAt: row.paid_at ? new Date(row.paid_at).getTime() : null,
        createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now(),
        paymentMethod: row.payment_method || null
      };
    }

    function methodDisplayLabel(pm) {
      if (!pm) return null;
      const def = PAYMENT_METHODS[pm.method];
      if (!def) return null;
      const key = def.fields[0].key;
      const val = (pm.details || {})[key] || '';
      return `${def.label}: ${val}`;
    }

    async function loadGames() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.from(GAMES_TABLE).select('id,name').order('name', { ascending: true });
      if (error) { console.error('loadGames failed:', error.message); return; }
      GAMES = data || [];
    }

    async function loadDevexRate() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.from(SETTINGS_TABLE).select('devex_rate').eq('id', 1).maybeSingle();
      if (!error && data && data.devex_rate != null) DEVEX_RATE = Number(data.devex_rate);
    }

    async function loadAppData() {
      if (!supabaseClient) { appDataReady = true; return; }
      await Promise.all([loadGames(), loadDevexRate()]);
      appDataReady = true;
    }

    function getStoredToken() {
      try { return localStorage.getItem(SESSION_STORAGE_KEY); } catch (e) { return null; }
    }
    function storeToken(token) {
      try { localStorage.setItem(SESSION_STORAGE_KEY, token); } catch (e) { }
    }
    function clearToken() {
      try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) { }
    }

    function beginLogin(returnHash) {
      try { sessionStorage.setItem(RETURN_HASH_KEY, returnHash || window.location.hash || '#/'); } catch (e) { }
      window.location.href = EDGE_BASE + '/roblox-auth-start';
    }

    function takeReturnHash() {
      let target = '#/';
      try {
        const stored = sessionStorage.getItem(RETURN_HASH_KEY);
        if (stored) target = stored;
        sessionStorage.removeItem(RETURN_HASH_KEY);
      } catch (e) { }
      return target;
    }

    async function verifySession() {
      const token = getStoredToken();
      if (!token) { isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; return; }
      try {
        const res = await fetch(EDGE_BASE + '/hr-session', {
          headers: {
            Authorization: 'Bearer ' + token,
            'ngrok-skip-browser-warning': 'true'
          }
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.ok) {
          isHrAuthed = true;
          hrUsername = json.robloxUsername || '';
          hrRoles = json.roles || [];
          hrPermissions = json.permissions || [];
        } else {
          isHrAuthed = false;
          hrUsername = '';
          hrRoles = [];
          hrPermissions = [];
          clearToken();
        }
      } catch (e) {
        isHrAuthed = false;
        hrUsername = '';
        hrRoles = [];
        hrPermissions = [];
      }
    }

    async function callHrData(action, payload) {
      const token = getStoredToken();
      const res = await fetch(EDGE_BASE + '/hr-data', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + (token || ''),
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ action, payload: payload || {} })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.ok) {
        if (res.status === 401) { clearToken(); isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; }
        throw new Error((json && json.error) || 'That request failed.');
      }
      return json;

    async function exportRequestsToXlsx(rows, sheetLabel) {
      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'PlayVerse Payment Log';
      workbook.created = new Date();

      const sheetName = (sheetLabel || 'Payments').slice(0, 31);
      const sheet = workbook.addWorksheet(sheetName, { views: [{ showGridLines: false }] });

      sheet.columns = [
        { width: 5 },
        { width: 26 },
        { width: 22 },
        { width: 20 },
        { width: 52 },
        { width: 12 },
        { width: 12 },
        { width: 12 },
        { width: 12 },
        { width: 14 }
      ];

      sheet.mergeCells('A1:J3');
      const banner = sheet.getCell('A1');
      banner.value = 'PlayVerse Payment Log';
      banner.font = { name: 'Arial', size: 20, bold: true, color: { argb: 'FFFFFFFF' } };
      banner.alignment = { vertical: 'middle', horizontal: 'left', indent: 2 };
      for (let r = 1; r <= 3; r++) {
        for (let c = 1; c <= 10; c++) {
          sheet.getCell(r, c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF171A21' } };
        }
      }

      sheet.mergeCells('A4:J4');
      const sub = sheet.getCell('A4');
      sub.value = `Exported ${new Date().toLocaleString()}, DevEx rate ${(DEVEX_RATE * 10000).toFixed(2)} USD per 10,000 Robux`;
      sub.font = { name: 'Arial', size: 10, italic: true, color: { argb: 'FF5B616E' } };

      const headerRowNum = 6;
      const headers = ['#', 'DEV RBLX USERNAME', 'PRODUCER', 'GAME', 'TASK/BUG TITLE', 'APPROVED', 'PAID', 'R$', 'USD', 'DATE'];
      const headerRow = sheet.getRow(headerRowNum);
      headers.forEach((h, i) => { headerRow.getCell(i + 1).value = h; });
      headerRow.eachCell(cell => {
        cell.font = { name: 'Arial', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF171A21' } };
        cell.alignment = { vertical: 'middle', horizontal: 'left' };
      });
      headerRow.height = 22;
      sheet.views = [{ state: 'frozen', ySplit: headerRowNum, showGridLines: false }];

      rows.forEach((d, i) => {
        const rowNum = headerRowNum + 1 + i;
        const isRobux = d.currency === 'ROBUX';
        const row = sheet.getRow(rowNum);
        row.getCell(1).value = i + 1;
        row.getCell(2).value = d.robloxUsername || '';
        row.getCell(3).value = d.requestedBy || '';
        row.getCell(4).value = d.game || '';
        row.getCell(5).value = d.taskName || '';
        row.getCell(6).value = true;
        row.getCell(7).value = !!d.paid;
        if (isRobux) {
          row.getCell(8).value = Number(d.payment) || 0;
          row.getCell(9).value = { formula: `IF(H${rowNum}="","",H${rowNum}*${DEVEX_RATE})` };
        } else {
          row.getCell(8).value = '';
          row.getCell(9).value = Number(d.payment) || 0;
        }
        row.getCell(10).value = new Date(d.createdAt || Date.now());
        row.getCell(10).numFmt = 'dd/mm/yyyy';
        row.getCell(8).numFmt = '#,##0';
        row.getCell(9).numFmt = '$#,##0.00';
        row.eachCell(cell => {
          cell.border = { bottom: { style: 'thin', color: { argb: 'FFE4E7ED' } } };
          cell.font = { name: 'Arial', size: 11 };
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `playverse-payments-${(sheetLabel || 'all').toLowerCase()}-${stamp}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function parseHashQuery() {
      const hash = window.location.hash;
      const qIndex = hash.indexOf('?');
      const query = qIndex === -1 ? '' : hash.slice(qIndex + 1);
      return new URLSearchParams(query);
    }

    async function initAuth() {
      await verifySession();
      await loadAppData();
      authReady = true;
      route();
    }

    async function hrSignOut() {
      const token = getStoredToken();
      if (token) {
        try {
          await fetch(EDGE_BASE + '/hr-session', {
            method: 'DELETE',
            headers: {
              Authorization: 'Bearer ' + token,
              'ngrok-skip-browser-warning': 'true'
            }
          });
        } catch (e) { }
      }
      clearToken();
      isHrAuthed = false;
      hrUsername = '';
      hrRoles = [];
      hrPermissions = [];
      window.location.hash = '#/';
    }

    const app = document.getElementById('app');

    async function handleAuthCallback() {
      app.innerHTML = `
    ${topbar()}
    <div class="gate-shell">
      <div class="gate-card">
        <div class="gate-icon">PV</div>
        <h2>Signing you in</h2>
        <p>Confirming your Roblox account.</p>
      </div>
    </div>`;

      const params = parseHashQuery();
      const err = params.get('error');
      const token = params.get('session');

      if (token) {
        storeToken(token);
        await verifySession();
      }

      if (isHrAuthed) {
        window.location.hash = takeReturnHash();
      } else {
        const fallbackErr = err || (token ? 'session_invalid' : null);
        window.location.hash = '#/hr' + (fallbackErr ? ('?error=' + encodeURIComponent(fallbackErr)) : '');
      }
    }

    function route() {
      if (!authReady) return;
      const path = window.location.hash.split('?')[0];
      if (path === '#/auth-callback') { handleAuthCallback(); return; }
      if (path === '#/hr' || path === '#/dashboard') {
        if (isHrAuthed) renderDashboard(); else renderHrGate();
      } else if (path === '#/manage') {
        if (isHrAuthed) renderManagePanel(); else renderHrGate();
      } else if (path === '#/my') {
        if (isHrAuthed) renderMyPayments(); else renderHrGate();
      } else if (path === '#/new') {
        if (isHrAuthed && canSubmitRequests()) renderCreateView(); else if (isHrAuthed) renderMyPayments(); else renderHrGate();
      } else {
        if (isHrAuthed) {
          renderMyPayments();
        } else {
          renderHrGate();
        }
      }
    }
    window.addEventListener('hashchange', route);
    initAuth();

    function topbar() {
      const canSeeDashboard = isHrAuthed && hasPermission('dashboard.view');
      const canSeeManage = isHrAuthed && (hasPermission('settings.manage_games') || hasPermission('settings.manage_rate') || hasPermission('settings.manage_groups') || hasPermission('settings.manage_base_access') || hasPermission('roles.manage'));

      <a class="brand" href="#"><span class="dot"></span>PlayVerse<small>Payment Log</small></a>
      <div class="topbar-right">
        <a class="link" href="https://www.playverse.gg" target="_blank" rel="noopener">playverse.gg</a>
        ${isHrAuthed
          ? `<span class="link mono" style="font-size:11.5px;">${esc(hrUsername)}</span><a class="hr-pill" href="#/my">My payments</a>${canSubmitRequests() ? `<a class="hr-pill" href="#/new">New request</a>` : ''}${canSeeDashboard ? `<a class="hr-pill" href="#/dashboard"><span class="dot-live"></span>Dashboard</a>` : ''}${canSeeManage ? `<a class="hr-pill" href="#/manage">Manage</a>` : ''}<button class="hr-pill" id="signOutBtn">Sign out</button>`

      let eligibilityLoading = new Set();

        let rows = allRequests.filter(r => filter === 'all' ? true : r.status === filter);
        if (search.trim()) {

        document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { filter = b.dataset.filter; paint(); }));

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('input', () => { search = searchInput.value; paint(); searchInput.focus(); searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length; });
        }

        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', () => { load(); });

        const retryBtn = document.getElementById('retryBtn');
        if (retryBtn) retryBtn.addEventListener('click', () => { load(); });

        const copyAllBtn = document.getElementById('copyAllBtn');
        if (copyAllBtn) copyAllBtn.addEventListener('click', (e) => {
          const tsv = [TSV_HEADER, ...rows.map(rowToTSV)].join('\n');
          copyText(tsv, e.currentTarget, 'Copied table!');
        });

        const exportXlsxBtn = document.getElementById('exportXlsxBtn');
        if (exportXlsxBtn) exportXlsxBtn.addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          const original = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Building file...';
          try {
            await exportRequestsToXlsx(rows, filter);
          } catch (err) {
            alert('Could not build the spreadsheet. Please try again.');
          } finally {
            btn.disabled = false;
            btn.textContent = original;
          }
        });

        document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.toggle;
          if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
          paint();
        }));

        document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', (e) => {
          const id = b.dataset.copy;
          const r = allRequests.find(x => x.id === id);
          if (r) copyText([TSV_HEADER, rowToTSV(r)].join('\n'), e.currentTarget, 'Copied!');
        }));

        document.querySelectorAll('[data-check-elig]').forEach(b => b.addEventListener('click', async (e) => {
          const username = b.dataset.checkElig;
          eligibilityLoading.add(username);
          paint();
          try {
            const data = await getUserEligibility(username);
            eligibilityCache[username] = data;
          } catch (err) {
            eligibilityCache[username] = [];
          }
          eligibilityLoading.delete(username);
          paint();
        }));

        document.querySelectorAll('[data-paid]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.paid;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Saving...';
          try {
            r.paid = true;
            r.status = 'paid';
            r.paidAt = Date.now();
            await updateRequest(r);
            paint();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Mark paid';
            alert('Could not save. Check your connection and try again.');
          }
        }));

        document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.reject;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          const note = prompt('Reason for rejecting this request (optional):', '') || '';
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Saving...';
          try {
            r.status = 'rejected';
            r.statusNote = note;
            r.paid = false;
            r.paidAt = null;
            await rejectRequest(id, note);
            paint();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Reject';
            alert('Could not save. Check your connection and try again.');
          }
        }));

        document.querySelectorAll('[data-reopen]').forEach(b => b.addEventListener('click', async (e) => {
          const id = b.dataset.reopen;
          const r = allRequests.find(x => x.id === id);
          if (!r) return;
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Saving...';
          try {
            r.status = 'pending';
            r.statusNote = '';
            r.paid = false;
            r.paidAt = null;
            await reopenRequest(id);
            paint();
          } catch (err) {
            e.currentTarget.disabled = false;
            e.currentTarget.textContent = 'Reopen';
            alert('Could not save. Check your connection and try again.');
          }
        }));
      }

      async function load() {
        loading = true; loadError = null; paint();
        try {
          allRequests = await loadAllRequests();
        } catch (err) {
          loadError = (err && err.message) ? err.message : 'Something went wrong while reading the shared request list.';
        }
        loading = false;
        paint();
      }

      load();
    }

            <div class="field">
              <label>Role</label>
              <select id="newAssignmentRoleId" ${roles.length === 0 ? 'disabled' : ''}>
                <option value="">${roles.length === 0 ? 'No roles available' : 'Select a role'}</option>
                ${roles.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}
              </select>
            </div>
            <button class="btn btn-primary" id="addAssignmentBtn" ${addingAssignment || roles.length === 0 ? 'disabled' : ''}>${addingAssignment ? 'Assigning...' : 'Assign role'}</button>
          </div>
        </div>
      </div>` : ''}
    </div>`;

        wireTopbarSignOut();

        if (canManageBaseAccess) {
          const saveBaseAccessBtn = document.getElementById('saveBaseAccessBtn');
          if (saveBaseAccessBtn) saveBaseAccessBtn.addEventListener('click', async () => {
            const groupIdRaw = document.getElementById('baseGroupId').value;
            const minRankRaw = document.getElementById('baseMinRank').value;
            const groupId = groupIdRaw === '' ? null : Number(groupIdRaw);
            const minRank = minRankRaw === '' ? null : Number(minRankRaw);
            if (groupId != null && !(groupId > 0)) { baseAccessError = 'Enter a valid Roblox group ID, or leave it blank to allow anyone.'; baseAccessSuccess = false; paint(); return; }
            savingBaseAccess = true; baseAccessError = null; baseAccessSuccess = false; paint();
            try {
              await saveBaseAccess(groupId, minRank);
              baseAccess = { groupId, minRank };
              savingBaseAccess = false; baseAccessSuccess = true; paint();
            } catch (err) {
              savingBaseAccess = false;
              baseAccessError = (err && err.message) ? err.message : 'Could not save the sign-in requirement. Check your connection and try again.';
              paint();
            }
          });
        }

        if (canManageRate) {
          const saveRateBtn = document.getElementById('saveRateBtn');
          if (saveRateBtn) saveRateBtn.addEventListener('click', async () => {
            const input = document.getElementById('ratePer10k');
            const per10k = Number(input.value);
            if (!(per10k >= 0)) { rateError = 'Enter a valid, non-negative number.'; rateSuccess = false; paint(); return; }
            savingRate = true; rateError = null; rateSuccess = false; paint();
            try {
              await saveDevexRate(per10k / 10000);
              savingRate = false; rateSuccess = true; paint();
            } catch (err) {
              savingRate = false;
              rateError = (err && err.message) ? err.message : 'Could not save the rate. Check your connection and try again.';
              paint();
            }
          });
        }

        if (canManageGames) {
          const addGameBtn = document.getElementById('addGameBtn');
          if (addGameBtn) addGameBtn.addEventListener('click', async () => {
            const input = document.getElementById('newGameName');
            const name = input.value.trim();
            if (!name) { gameError = 'Enter a game name.'; paint(); return; }
            addingGame = true; gameError = null; paint();
            try {
              await addGame(name);
              addingGame = false; paint();
            } catch (err) {
              addingGame = false;
              gameError = (err && err.message) ? err.message : 'Could not add that game, it may already exist.';
              paint();
            }
          });

          document.querySelectorAll('[data-del-game]').forEach(el => el.addEventListener('click', async () => {
            const id = el.dataset.delGame;
            if (!confirm('Remove this game from the list? Existing requests keep the game name they were logged with.')) return;
            try {
              await deleteGame(id);
              paint();
            } catch (err) {
              alert('Could not remove that game. Check your connection and try again.');
            }
          }));
        }

        if (canManageGroups) {
          const addGroupBtn = document.getElementById('addGroupBtn');
          if (addGroupBtn) addGroupBtn.addEventListener('click', async () => {
            const groupId = document.getElementById('newGroupId').value;
            const name = document.getElementById('newGroupName').value.trim();
            if (!groupId || !name) { addGroupError = 'Enter a group ID and a display name.'; paint(); return; }
            addingGroup = true; addGroupError = null; paint();
            try {
              await addRequiredGroup({ robloxGroupId: groupId, name });
              addingGroup = false;
              await loadGroups();
            } catch (err) {
              addingGroup = false;
              addGroupError = (err && err.message) ? err.message : 'Could not add that group.';
              paint();
            }
          });

          document.querySelectorAll('[data-del-group]').forEach(el => el.addEventListener('click', async () => {
            const id = el.dataset.delGroup;
            if (!confirm('Remove this eligibility requirement?')) return;
            try {
              await deleteRequiredGroup(id);
              await loadGroups();
            } catch (err) {
              alert('Could not remove that group. Check your connection and try again.');
            }
          }));
        }

        if (canManageRoles) {
          const addRoleBtn = document.getElementById('addRoleBtn');
          if (addRoleBtn) addRoleBtn.addEventListener('click', async () => {
            const name = document.getElementById('newRoleName').value.trim();
            const groupId = document.getElementById('newRoleGroupId').value;
            const minRank = document.getElementById('newRoleMinRank').value;
            const permissions = Array.from(document.querySelectorAll('.newRolePerm:checked')).map(el => el.value);
            if (!name) { addRoleError = 'Enter a role name.'; paint(); return; }
            addingRole = true; addRoleError = null; paint();
            try {
              await addRole({ name, robloxGroupId: groupId, minRank, permissions });
              addingRole = false;
              await loadRoles();
            } catch (err) {
              addingRole = false;
              addRoleError = (err && err.message) ? err.message : 'Could not add that role.';
              paint();
            }
          });

          document.querySelectorAll('[data-del-role]').forEach(el => el.addEventListener('click', async () => {
            const id = el.dataset.delRole;
            if (!confirm('Remove this role? Anyone who only had access through it will lose access.')) return;
            try {
              await deleteRole(id);
              await loadRoles();
            } catch (err) {
              alert('Could not remove that role. Check your connection and try again.');
            }
          }));

          const addAssignmentBtn = document.getElementById('addAssignmentBtn');
          if (addAssignmentBtn) addAssignmentBtn.addEventListener('click', async () => {
            const userId = document.getElementById('newAssignmentUserId').value;
            const roleId = document.getElementById('newAssignmentRoleId').value;
            if (!userId || !roleId) { addAssignmentError = 'Enter a Roblox user ID and pick a role.'; paint(); return; }
            addingAssignment = true; addAssignmentError = null; paint();
            try {
              await addRoleAssignment(roleId, userId);
              addingAssignment = false;
              await loadAssignments();
            } catch (err) {
              addingAssignment = false;
              addAssignmentError = (err && err.message) ? err.message : 'Could not assign that role.';
              paint();
            }
          });

          document.querySelectorAll('[data-del-assignment]').forEach(el => el.addEventListener('click', async () => {
            const id = el.dataset.delAssignment;
            try {
              await deleteRoleAssignment(id);
              await loadAssignments();
            } catch (err) {
              alert('Could not remove that assignment. Check your connection and try again.');
            }
          }));
        }
      }

      async function loadGroups() {
        groupsLoading = true; groupsError = null; paint();
        try {
          requiredGroups = await listRequiredGroups();
        } catch (err) {
          groupsError = (err && err.message) ? err.message : 'Could not load groups.';
        }
        groupsLoading = false;
        paint();
      }

      async function loadBaseAccess() {
        baseAccessLoading = true; baseAccessError = null; paint();
        try {
          baseAccess = await getBaseAccess();
        } catch (err) {
          baseAccessError = (err && err.message) ? err.message : 'Could not load the current sign-in requirement.';
        }
        baseAccessLoading = false;
        paint();
      }

      async function loadRoles() {
        rolesLoading = true; rolesError = null; paint();
        try {
          roles = await listRoles();
        } catch (err) {
          rolesError = (err && err.message) ? err.message : 'Could not load roles.';
        }
        rolesLoading = false;
        paint();
      }

      async function loadAssignments() {
        try {
          assignments = await listRoleAssignments();
        } catch (err) {
          assignments = [];
        }
        paint();
      }

      paint();
      if (canManageGroups) loadGroups();
      if (canManageBaseAccess) loadBaseAccess();
      if (canManageRoles) {
        loadRoles().then(loadAssignments);
      }
    }

    function renderCreateView() {
      if (!authReady) { app.innerHTML = topbar(); return; }

      if (!isHrAuthed) {
        app.innerHTML = `
    ${topbar()}
    <div class="lock-overlay">
      <div class="lock-card">
        <div class="gate-icon">PV</div>
        <h2>Sign in to continue</h2>
        <p>Sign in with your Roblox account and be in the studio group at the required rank to log a payment request.</p>
        ${configError ? `<div class="error-box"><span>${esc(configError)}</span></div>` : ''}
        <button class="btn btn-primary roblox-btn" id="lockSignInBtn" ${configError ? 'disabled' : ''}>Sign in with Roblox</button>
        <div class="lock-note">You can't log a request until you sign in.</div>
      </div>
    </div>`;
        wireTopbarSignOut();
        const btn = document.getElementById('lockSignInBtn');
        if (btn) btn.addEventListener('click', () => beginLogin('#/new'));
        return;
      }

      if (!canSubmitRequests()) {
        window.location.hash = '#/my';
        return;
      }

      let submitted = false;
      let submitting = false;
      let submitError = null;
      let fieldErrors = {};
      let targetMethod = null;
      let targetMethodLoaded = false;
      let targetMethodLoading = false;
      let targetMethodLookupTimer = null;
      let lastLookedUpUsername = '';

      function currentData() {
        const username = document.getElementById('f_username')?.value.trim() || '';
        const task = document.getElementById('f_task')?.value.trim() || '';
        const game = document.getElementById('f_game')?.value || '';
        const workRaw = document.getElementById('f_work')?.value || '';
        const timeWorked = document.getElementById('f_time')?.value.trim() || '';
        const paymentRaw = document.getElementById('f_payment')?.value || '0';
        const currency = document.getElementById('f_currency')?.value || 'ROBUX';
        return {
          id: '', robloxUsername: username, taskName: task, game, workRaw, timeWorked,
          payment: Number(paymentRaw) || 0, currency, requestedBy: hrUsername, createdAt: Date.now(), paid: false, paidAt: null
        };
      }

      function validate(data) {
        const errs = {};
        if (!data.robloxUsername) errs.f_username = "The developer's Roblox username is required.";
        if (!data.taskName) errs.f_task = 'Task name is required.';
        if (!data.game) errs.f_game = 'Select which game this work was for.';
        if (!data.payment || data.payment <= 0) errs.f_payment = 'Enter a payment amount greater than 0.';
        return errs;
      }

      function paint() {
        app.innerHTML = `
    ${topbar()}
    <div class="shell">
      <div class="heading-block">
        <span class="eyebrow">Producer tool</span>
        <h1>Log a payment for a developer</h1>
        <p class="sub">Log this on behalf of a developer. Fill in what they completed and send it for HR review, it'll show up under their "My payments" once submitted.</p>
      </div>

      ${configError ? `<div class="error-box"><span>${esc(configError)}</span></div>` : ''}
       
      ${submitted ? `
      <div class="confirm-box">
        <div class="icon">&#10003;</div>
        <div class="txt"><strong>Request submitted</strong><span>HR can see it on the dashboard now, and the developer will see it under their payments.</span></div>
      </div>
      <button class="btn btn-ghost" id="anotherBtn" style="margin-bottom:26px;">Log another request</button>
      ` : ''}

      <div class="create-grid">
        <div class="panel">
          ${submitError ? `<div class="error-box"><span>${esc(submitError)}</span></div>` : ''}
          <div class="field">
            <label>Developer's Roblox Username</label>
            <input type="text" id="f_username" placeholder="Builderman" class="${fieldErrors.f_username ? 'field-invalid' : ''}">
            ${fieldErrors.f_username ? `<div class="err-hint">${esc(fieldErrors.f_username)}</div>` : ''}
            <div id="methodWarningSlot"></div>
          </div>
          <div class="field">
            <label>Game</label>
            <select id="f_game" class="${fieldErrors.f_game ? 'field-invalid' : ''}" ${!appDataReady || GAMES.length === 0 ? 'disabled' : ''}>
              <option value="">${!appDataReady ? 'Loading games...' : (GAMES.length ? 'Select a game' : 'No games configured yet')}</option>
              ${GAMES.map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('')}
            </select>
            ${fieldErrors.f_game ? `<div class="err-hint">${esc(fieldErrors.f_game)}</div>` : ''}
            ${appDataReady && GAMES.length === 0 ? `<div class="err-hint" style="color:var(--muted);">Ask an admin to add a game from the Manage panel first.</div>` : ''}
          </div>
          <div class="field">
            <label>Task Name</label>
            <input type="text" id="f_task" placeholder="Rebirth System" class="${fieldErrors.f_task ? 'field-invalid' : ''}">
            ${fieldErrors.f_task ? `<div class="err-hint">${esc(fieldErrors.f_task)}</div>` : ''}
          </div>
          <div class="field">
            <label>Work Completed <span class="hint">(one line per item)</span></label>
            <textarea id="f_work" placeholder="Added stuff to the rebirth system"></textarea>
          </div>
          <div class="row3">
            <div class="field"><label>Time Worked</label><input type="text" id="f_time" placeholder="2h 30m"></div>
            <div class="field">
              <label>Payment Amount</label>
              <input type="number" id="f_payment" placeholder="1250" min="0" class="${fieldErrors.f_payment ? 'field-invalid' : ''}">
              ${fieldErrors.f_payment ? `<div class="err-hint">${esc(fieldErrors.f_payment)}</div>` : ''}
            </div>
            <div class="field">
              <label>Currency</label>
              <select id="f_currency">
                <option value="ROBUX">Robux</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
          </div>
          <div class="field" style="margin-top:-10px;"><span class="hint" style="margin-left:0;">${devexLabel()}</span></div>
          <div class="field"><label>Submitted by (you)</label><input type="text" id="f_requester" value="${esc(hrUsername)}" disabled></div>
          <button class="btn btn-primary" id="submitBtn" ${submitting || configError ? 'disabled' : ''}>${submitting ? 'Submitting...' : 'Submit to HR review'}</button>
        </div>

        <div>
          <div class="preview-label">Live preview</div>
          <div id="previewSlot">${renderInvoice(currentData())}</div>
        </div>
      </div>
    </div>`;

        wireTopbarSignOut();

        const ids = ['f_username', 'f_task', 'f_game', 'f_work', 'f_time', 'f_payment', 'f_currency'];
        ids.forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('input', updatePreview);
          el.addEventListener('change', updatePreview);
        });

        const usernameInput = document.getElementById('f_username');
        if (usernameInput) {
          usernameInput.addEventListener('input', scheduleTargetMethodLookup);
          usernameInput.addEventListener('blur', () => lookupTargetMethod(usernameInput.value.trim()));
        }
        renderMethodWarning();

        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.addEventListener('click', handleSubmit);

        const anotherBtn = document.getElementById('anotherBtn');
        if (anotherBtn) anotherBtn.addEventListener('click', () => {
          submitted = false; submitError = null; fieldErrors = {};
          targetMethod = null; targetMethodLoaded = false; lastLookedUpUsername = '';
          paint();
        });
      }

      function updatePreview() {
        const slot = document.getElementById('previewSlot');
        if (slot) slot.innerHTML = renderInvoice(currentData());
      }

      function scheduleTargetMethodLookup() {
        const usernameInput = document.getElementById('f_username');
        if (!usernameInput) return;
        if (targetMethodLookupTimer) clearTimeout(targetMethodLookupTimer);
        targetMethodLookupTimer = setTimeout(() => {
          lookupTargetMethod(usernameInput.value.trim());
        }, 500);
      }

      async function lookupTargetMethod(username) {
        if (!username || username === lastLookedUpUsername) return;
        lastLookedUpUsername = username;
        targetMethodLoading = true;
        targetMethodLoaded = false;
        renderMethodWarning();
        try {
          targetMethod = await getPaymentMethodForUser(username);
        } catch (err) {
          targetMethod = null;
        }
        targetMethodLoading = false;
        targetMethodLoaded = true;
        renderMethodWarning();
      }

      function renderMethodWarning() {
        const slot = document.getElementById('methodWarningSlot');
        if (!slot) return;
        if (targetMethodLoading) {
          slot.innerHTML = `<div class="hint" style="margin-left:0;display:block;margin-top:6px;">Checking payment method on file...</div>`;
        } else if (targetMethodLoaded && !targetMethod) {
          slot.innerHTML = `<div class="warn-box" style="margin-top:10px;margin-bottom:0;"><span>No payment method on file yet. You can still submit this, but they'll need to add one under "My payments" before it gets paid.</span></div>`;
        } else if (targetMethodLoaded && targetMethod) {
          slot.innerHTML = `<div class="hint" style="margin-left:0;display:block;margin-top:6px;color:var(--ok-text);">On file: ${esc(methodDisplayLabel(targetMethod))}</div>`;
        } else {
          slot.innerHTML = '';
        }
      }

      async function handleSubmit() {
        const data = currentData();
        const errs = validate(data);
        if (Object.keys(errs).length) {
          fieldErrors = errs;
          submitError = 'Please fix the highlighted fields before submitting.';
          paint();
          return;
        }
        fieldErrors = {};

        if (data.currency === 'ROBUX') {
          submitting = true; submitError = null; paint();

          let eligibility = [];
          try {
            eligibility = await getUserEligibility(data.robloxUsername);
          } catch (err) {
            submitting = false;
            submitError = "Could not verify the developer's payout group membership. Check your connection and try again.";
            paint();
            return;
          }

          const missingGroups = eligibility.filter(g => !g.eligible);
          if (missingGroups.length > 0) {
            submitting = false;
            submitError = 'Request failed: the developer is not a member of all required payout groups.';
            paint();
            alert(
              'Request failed.\n\n' +
              'The developer is missing:\n\n' +
              missingGroups.map(g => '- ' + g.name).join('\n') +
              '\n\nHave them join, then try again.'
            );
            return;
          }

          const beenInLongEnough = confirm('Has the developer been in all required groups for over 2 weeks?');
          if (!beenInLongEnough) {
            const proceedAnyway = confirm(
              'HR may reject this if they haven\'t been in the group(s) for 2 weeks yet.\n\n' +
              'Submit anyway?'
            );
            if (!proceedAnyway) {
              submitting = false;
              paint();
              return;
            }
          }
        }

        submitting = true; submitError = null; paint();
        try {
          await saveRequest(data);
          submitting = false; submitted = true; paint();
        } catch (err) {
          submitting = false;
          submitError = (err && err.message) ? err.message : 'Could not submit this request. Check your connection and try again.';
          paint();
        }
      }

      paint();
    }
  </script>
</body>

</html>
