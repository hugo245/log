      function paintContent() {
        const contentEl = document.getElementById('anContent');
        if (!contentEl) return;

        const rows = getFilteredRows();
        const pendingRows = rows.filter(r => r.status === 'pending');
        const paidRows = rows.filter(r => r.status === 'paid');
        const pendingRobux = pendingRows.filter(r => r.currency === 'ROBUX').reduce((s, r) => s + (Number(r.payment) || 0), 0);
        const pendingUsd = pendingRows.filter(r => r.currency === 'USD').reduce((s, r) => s + (Number(r.payment) || 0), 0);
        const paidRobux = paidRows.filter(r => r.currency === 'ROBUX').reduce((s, r) => s + (Number(r.payment) || 0), 0);
        const paidUsd = paidRows.filter(r => r.currency === 'USD').reduce((s, r) => s + (Number(r.payment) || 0), 0);
        const paidUsdEquiv = paidRows.reduce((s, r) => s + usdEquivalent(r), 0);

        const owedRows = computeOwed(rows);
        const earningsRows = computeEarnings(rows);
        const breakdownRows = computeBreakdown(rows, groupBy);
        const chartData = buildChartData(rows);

        contentEl.innerHTML = buildContentHtml({ pendingRobux, pendingUsd, paidRobux, paidUsd, paidUsdEquiv, paidCount: paidRows.length, chartData, breakdownRows, owedRows, earningsRows });

        document.querySelectorAll('.an-toggle-btn').forEach(b => b.addEventListener('click', () => { groupBy = b.dataset.group; paintContent(); }));
        wireExploreEvents();

        drawExploreChart(chartData);
      }

      function wireShellEvents() {
        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', () => { load(); });

        if (searchInput) searchInput.addEventListener('input', () => { search = searchInput.value; paintContent(); });

        const personFilterInput = document.getElementById('personFilterInput');
        if (personFilterInput) personFilterInput.addEventListener('input', () => { personFilter = personFilterInput.value; paintContent(); });

        const bind = (id, setter) => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('change', () => { setter(el.value); paintContent(); });
        };
        bind('statusFilterSelect', v => statusFilter = v);
        bind('gameFilterSelect', v => gameFilter = v);
        bind('teamFilterSelect', v => teamFilter = v);
        bind('skillsetFilterSelect', v => skillsetFilter = v);
        bind('roleFilterSelect', v => roleFilter = v);
        bind('currencyFilterSelect', v => currencyFilter = v);

      function wireExploreEvents() {
        const bindChart = (id, setter) => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('change', () => { setter(el.value); paintContent(); });
        };
        bindChart('chartMetricSelect', v => chartMetric = v);

        bindChart('chartBreakdownSelect', v => { chartBreakdown = v; if (v !== 'none') chartOverlay = 'none'; });
        bindChart('chartRangeSelect', v => chartRange = v);

        document.querySelectorAll('.explore-chart-type-btn').forEach(b => b.addEventListener('click', () => { chartType = b.dataset.chartType; paintContent(); }));
        document.querySelectorAll('input[name="chartSmoothing"]').forEach(r => r.addEventListener('change', () => { chartSmoothing = r.value; paintContent(); }));
        document.querySelectorAll('input[name="chartOverlay"]').forEach(r => r.addEventListener('change', () => { if (!r.disabled) { chartOverlay = r.value; paintContent(); } }));
      }

      function drawExploreChart(chartData) {
        if (exploreChartInstance) { exploreChartInstance.destroy(); exploreChartInstance = null; }
        if (chartType === 'table' || typeof Chart === 'undefined') return;

        const canvas = document.getElementById('exploreChart');
        if (!canvas || !chartData.eligibleCount) return;

        const metric = METRICS[chartMetric];
        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim() || '#E4E7ED';
        const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || '#5B616E';
        const valueTick = v => metric.unit === 'usd' ? '$' + v : v;

        if (chartType === 'pie') {
          const top = chartData.totalsPerCat;
          exploreChartInstance = new Chart(canvas, {
            type: 'pie',
            data: {
              labels: top.map(t => t.label),
              datasets: [{
                data: top.map(t => Number(t.value.toFixed(2))),
                backgroundColor: top.map((_, i) => AN_PALETTE[i % AN_PALETTE.length])
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { color: inkColor, boxWidth: 11, font: { size: 11 } } } }
            }
          });
          return;
        }

        if (chartType === 'hbar') {
          const top = chartData.totalsPerCat.slice(0, 12);
          exploreChartInstance = new Chart(canvas, {
            type: 'bar',
            data: {
              labels: top.map(t => t.label),
              datasets: [{
                data: top.map(t => Number(t.value.toFixed(2))),
                backgroundColor: top.map((_, i) => AN_PALETTE[i % AN_PALETTE.length]),
                borderRadius: 6,
                maxBarThickness: 26
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: gridColor }, ticks: { color: inkColor, callback: valueTick } },
                y: { grid: { display: false }, ticks: { color: inkColor } }
              }
            }
          });
          return;
        }

        const stacked = chartType === 'stacked';
        const datasets = chartData.series.map((s, i) => ({
          label: s.label,
          data: chartSmoothing === 'ma7' && chartType === 'line' ? movingAverage(s.data, 7) : s.data,
          borderColor: AN_PALETTE[i % AN_PALETTE.length],
          backgroundColor: stacked ? AN_PALETTE[i % AN_PALETTE.length] : AN_PALETTE[i % AN_PALETTE.length] + (chartData.series.length === 1 ? '33' : '00'),
          fill: chartType === 'line' ? chartData.series.length === 1 : true,
          tension: .3,
          borderWidth: 2,
          pointRadius: chartData.labels.length > 40 ? 0 : 3,
          maxBarThickness: 46
        }));

        if (chartType === 'line' && chartOverlay === 'previous' && chartBreakdown === 'none') {
          const prev = computePreviousPeriodSeries(chartData.labels.length);
          if (prev) {
            datasets.push({
              label: 'Previous period',
              data: prev,
              borderColor: inkColor,
              backgroundColor: 'transparent',
              borderDash: [5, 4],
              fill: false,
              tension: .3,
              borderWidth: 2,
              pointRadius: 0
            });
          }
        }

        exploreChartInstance = new Chart(canvas, {
          type: chartType === 'stacked' ? 'bar' : 'line',
          data: { labels: chartData.labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: datasets.length > 1, position: 'bottom', labels: { color: inkColor, boxWidth: 11, font: { size: 11 } } } },
            scales: {
              x: { grid: { color: gridColor }, ticks: { color: inkColor }, stacked },
              y: { grid: { color: gridColor }, ticks: { color: inkColor, callback: valueTick }, stacked }
            }
          }
        });
      }

      function openProfile(idx) {
        const rows = getRows();

        configMsg = null;
        warnError = null;
        warnReason = '';
        warnings = [];
        bannedInfo = null;
        paymentMsg = null;
        paymentMethodSelected = 'PAYPAL';
        paymentMethodDetails = {};
        paintModal();
      }

      function closeProfile() {
        activeProfile = null;
        modalMode = 'view';
        paintModal();
      }

      async function openConfig() {
        modalMode = 'config';
        configMsg = null;
        configBusy = false;
        configTeamId = '';
        configSkillsetId = '';
        currentAssignments = [];
        currentAssignmentsLoading = true;
        paintModal();
        try {
          const [t, sk] = await Promise.all([listTeams(), listSkillsets()]);
          teamsList = t;
          skillsetsList = sk;
        } catch (e) {
          teamsList = [];
          skillsetsList = [];
        }
        try {
          currentAssignments = activeProfile.robloxUserId ? await listUserTeamAssignments(activeProfile.robloxUserId) : [];
        } catch (e) {
          currentAssignments = [];
        }
        currentAssignmentsLoading = false;
        paintModal();
      }

      async function openModerate() {
        modalMode = 'moderate';
        warnError = null;
        warnReason = '';
        warnBusy = false;
        try {
          const res = await listUserWarnings(activeProfile.robloxUserId);
          warnings = res.data || [];
          bannedInfo = res.banned || null;
          if (activeProfile) {
            activeProfile.warnCount = res.warnCount != null ? res.warnCount : warnings.length;
            activeProfile.isBanned = !!bannedInfo;
          }
        } catch (e) {
          warnings = [];
          bannedInfo = null;
        }
        paintModal();
      }

      async function openPayment() {
        modalMode = 'payment';
        paymentMsg = null;
        paymentBusy = false;
        paymentLoading = true;
        paymentMethodSelected = 'PAYPAL';
        paymentMethodDetails = {};
        paintModal();
        try {
          const existing = activeProfile.robloxUsername ? await getPaymentMethodForUser(activeProfile.robloxUsername) : null;
          if (existing) {
            paymentMethodSelected = existing.method;
            paymentMethodDetails = existing.details || {};
          }
        } catch (e) { }
        paymentLoading = false;
        paintModal();
      }

      function paintAdminMethodFields() {
        const slot = document.getElementById('adminMethodFieldsSlot');
        if (!slot) return;
        const def = PAYMENT_METHODS[paymentMethodSelected];
        slot.innerHTML = def.fields.map(f => `
          <div class="field">
            <label>${esc(f.label)}</label>
            <input type="${f.type}" data-admin-method-field="${f.key}" placeholder="${esc(f.placeholder || '')}" value="${esc(paymentMethodDetails[f.key] || '')}">
          </div>`).join('');
        slot.querySelectorAll('[data-admin-method-field]').forEach(el => el.addEventListener('input', () => {
          paymentMethodDetails[el.dataset.adminMethodField] = el.value;
        }));
      }

      async function paintModal() {
        const slot = document.getElementById('staffModalSlot');
        if (slot) slot.innerHTML = await modalHtml();
        wireModalEvents();
        if (modalMode === 'payment' && !paymentLoading) paintAdminMethodFields();
      }

      function wireModalEvents() {
        const scrim = document.getElementById('staffModalScrim');
        const closeBtn = document.getElementById('staffModalClose');
        if (scrim) scrim.addEventListener('click', (e) => { if (e.target === scrim) closeProfile(); });
        if (closeBtn) closeBtn.addEventListener('click', closeProfile);

        const openConfigBtn = document.getElementById('openConfigBtn');
        if (openConfigBtn) openConfigBtn.addEventListener('click', openConfig);
        const openModBtn = document.getElementById('openModBtn');
        if (openModBtn) openModBtn.addEventListener('click', openModerate);
        const openPaymentBtn = document.getElementById('openPaymentBtn');
        if (openPaymentBtn) openPaymentBtn.addEventListener('click', openPayment);

        const cfgBackBtn = document.getElementById('cfgBackBtn');
        if (cfgBackBtn) cfgBackBtn.addEventListener('click', () => { modalMode = 'view'; paintModal(); });
        const modBackBtn = document.getElementById('modBackBtn');
        if (modBackBtn) modBackBtn.addEventListener('click', () => { modalMode = 'view'; paintModal(); });
        const paymentBackBtn = document.getElementById('paymentBackBtn');
        if (paymentBackBtn) paymentBackBtn.addEventListener('click', () => { modalMode = 'view'; paintModal(); });

        document.querySelectorAll('input[name="adminMethodChoice"]').forEach(el => el.addEventListener('change', () => {
          paymentMethodSelected = el.value;
          paymentMethodDetails = {};
          paintModal();
        }));

        const savePaymentBtn = document.getElementById('savePaymentBtn');
        if (savePaymentBtn) savePaymentBtn.addEventListener('click', async () => {
          const def = PAYMENT_METHODS[paymentMethodSelected];
          const missing = def.fields.find(f => !String(paymentMethodDetails[f.key] || '').trim());
          if (missing) { paymentMsg = { ok: false, text: `Enter a value for "${missing.label}".` }; paintModal(); return; }
          paymentBusy = true; paymentMsg = null; paintModal();
          try {
            await adminSetPaymentMethod(activeProfile.robloxUserId, activeProfile.robloxUsername, paymentMethodSelected, paymentMethodDetails);
            paymentBusy = false;
            paymentMsg = { ok: true, text: 'Payment method saved.' };
            paintModal();
          } catch (err) {
            paymentBusy = false;
            paymentMsg = { ok: false, text: (err && err.message) ? err.message : 'Could not save this payment method.' };
            paintModal();
          }
        });

        const cfgSaveBtn = document.getElementById('cfgSaveBtn');
        if (cfgSaveBtn) cfgSaveBtn.addEventListener('click', async () => {
          const teamEl = document.getElementById('cfgTeam');
          const skEl = document.getElementById('cfgSkillset');
          configTeamId = teamEl ? teamEl.value : '';
          configSkillsetId = skEl ? skEl.value : '';
          if (!configTeamId) { configMsg = { ok: false, text: 'Pick a team to add.' }; paintModal(); return; }
          configBusy = true; configMsg = null; paintModal();
          try {
            await assignUserTeamSkillset(
              activeProfile.robloxUserId,
              activeProfile.robloxUsername,
              configTeamId,
              configSkillsetId || null
            );
            currentAssignments = await listUserTeamAssignments(activeProfile.robloxUserId);
            const teamNames = currentAssignments.map(a => a.team && a.team.name).filter(Boolean);
            const skillsetNames = [...new Set(currentAssignments.map(a => a.skillset && a.skillset.name).filter(Boolean))];
            activeProfile.team = teamNames.join(', ') || null;
            activeProfile.skillset = skillsetNames.join(', ') || null;
            const idx = staff.findIndex(x => x.robloxUserId === activeProfile.robloxUserId);
            if (idx >= 0) {
              staff[idx].team = activeProfile.team;
              staff[idx].skillset = activeProfile.skillset;
            }
            configTeamId = ''; configSkillsetId = '';
            configBusy = false;
            configMsg = { ok: true, text: 'Team added.' };
            paintModal();
            paintTable();
          } catch (err) {
            configBusy = false;
            configMsg = { ok: false, text: (err && err.message) ? err.message : 'Could not add that team.' };
            paintModal();
          }
        });

        document.querySelectorAll('[data-remove-team]').forEach(el => el.addEventListener('click', async () => {
          const teamId = el.dataset.removeTeam;
          removeBusyTeamId = teamId; configMsg = null; paintModal();
          try {
            await removeUserTeamAssignment(activeProfile.robloxUserId, teamId);
            currentAssignments = await listUserTeamAssignments(activeProfile.robloxUserId);
            const teamNames = currentAssignments.map(a => a.team && a.team.name).filter(Boolean);
            const skillsetNames = [...new Set(currentAssignments.map(a => a.skillset && a.skillset.name).filter(Boolean))];
            activeProfile.team = teamNames.join(', ') || null;
            activeProfile.skillset = skillsetNames.join(', ') || null;
            const idx = staff.findIndex(x => x.robloxUserId === activeProfile.robloxUserId);
            if (idx >= 0) {
              staff[idx].team = activeProfile.team;
              staff[idx].skillset = activeProfile.skillset;
            }
            removeBusyTeamId = null;
            configMsg = { ok: true, text: 'Team removed.' };
            paintModal();
            paintTable();
          } catch (err) {
            removeBusyTeamId = null;
            configMsg = { ok: false, text: (err && err.message) ? err.message : 'Could not remove that team.' };
            paintModal();
          }
        }));

        const issueWarnBtn = document.getElementById('issueWarnBtn');
        if (issueWarnBtn) issueWarnBtn.addEventListener('click', async () => {
          const input = document.getElementById('warnReasonInput');
          warnReason = input ? input.value.trim() : '';
          if (!warnReason) { warnError = 'Enter a reason for the warning.'; paintModal(); return; }
          warnBusy = true; warnError = null; paintModal();
          try {
            const res = await addUserWarning(activeProfile.robloxUserId, activeProfile.robloxUsername, warnReason);
            activeProfile.warnCount = res.warnCount || 0;
            if (res.banned) activeProfile.isBanned = true;
            const idx = staff.findIndex(x => x.robloxUserId === activeProfile.robloxUserId);
            if (idx >= 0) {
              staff[idx].warnCount = activeProfile.warnCount;
              staff[idx].isBanned = activeProfile.isBanned;
            }
            warnReason = '';
            warnBusy = false;
            await openModerate();
            paintTable();
          } catch (err) {
            warnBusy = false;
            warnError = (err && err.message) ? err.message : 'Could not issue warning.';
            paintModal();
          }
        });

        const unbanBtn = document.getElementById('unbanBtn');
        if (unbanBtn) unbanBtn.addEventListener('click', async () => {
          if (!confirm('Lift the ban for this account? They will be able to sign in again. Existing warnings stay on record.')) return;
          warnBusy = true; paintModal();
          try {
            await unbanUser(activeProfile.robloxUserId);
            activeProfile.isBanned = false;
            bannedInfo = null;
            const idx = staff.findIndex(x => x.robloxUserId === activeProfile.robloxUserId);
            if (idx >= 0) staff[idx].isBanned = false;
            warnBusy = false;
            await openModerate();
            paintTable();
          } catch (err) {
            warnBusy = false;
            warnError = (err && err.message) ? err.message : 'Could not lift the ban.';
            paintModal();
          }
        });

        document.querySelectorAll('.remove-warn-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const warningId = btn.dataset.warningId;
            if (!confirm('Remove this warning? This cannot be undone.')) return;
            warnBusy = true; warnError = null; paintModal();
            try {
              const res = await removeUserWarning(warningId);
              activeProfile.warnCount = res.warnCount || 0;
              const idx = staff.findIndex(x => x.robloxUserId === activeProfile.robloxUserId);
              if (idx >= 0) staff[idx].warnCount = activeProfile.warnCount;
              warnBusy = false;
              await openModerate();
              paintTable();
            } catch (err) {
              warnBusy = false;
              warnError = (err && err.message) ? err.message : 'Could not remove that warning.';
              paintModal();
            }
          });
        });
      }

              <select id="f_currency">
                <option value="ROBUX">Robux</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
          </div>
          <div class="field" style="margin-top:-10px;"><span class="hint" style="margin-left:0;">${devexLabel()}</span></div>
          <div class="field" id="usdEquivSlot" style="margin-top:-10px;${robuxEquivalentLabel(currentData()) ? '' : 'display:none;'}"><span class="hint" style="margin-left:0;">${robuxEquivalentLabel(currentData())}</span></div>
          <div class="field"><label>Submitted by (you)</label><input type="text" id="f_requester" value="${esc(hrUsername)}" disabled></div>
          <button class="btn btn-primary" id="submitBtn" ${submitting || configError ? 'disabled' : ''}>${submitting ? 'Submitting...' : 'Submit to HR review'}</button>
        </div>

        <div>
          <div class="preview-label">Live preview</div>
          <div id="previewSlot">${renderInvoice(currentData())}</div>
        </div>
      </div>
    </div>`;

        wireTopbarSignOut();

        const ids = ['f_username', 'f_task', 'f_game', 'f_work', 'f_time', 'f_payment', 'f_currency'];
        ids.forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('input', updatePreview);
          el.addEventListener('change', updatePreview);
        });

        const currencySelect = document.getElementById('f_currency');
        if (currencySelect) currencySelect.addEventListener('change', () => { currencyTouched = true; });

        const usernameInput = document.getElementById('f_username');
        if (usernameInput) {
          usernameInput.addEventListener('input', () => {
            scheduleTargetMethodLookup();
            scheduleUsernameSuggest();
          });
          usernameInput.addEventListener('blur', () => {
            lookupTargetMethod(usernameInput.value.trim());
            setTimeout(() => { usernameSuggestVisible = false; renderUsernameSuggestions(); }, 150);
          });
          usernameInput.addEventListener('focus', () => {
            if (usernameSuggestions.length) { usernameSuggestVisible = true; renderUsernameSuggestions(); }
          });
        }
        renderMethodWarning();
        renderUsernameSuggestions();

        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.addEventListener('click', handleSubmit);

        const anotherBtn = document.getElementById('anotherBtn');
        if (anotherBtn) anotherBtn.addEventListener('click', () => {
          submitted = false; submitError = null; fieldErrors = {};
          targetMethod = null; targetMethodLoaded = false; lastLookedUpUsername = ''; currencyTouched = false;
          paint();
        });
      }

      function updatePreview() {
        const slot = document.getElementById('previewSlot');
        if (slot) slot.innerHTML = renderInvoice(currentData());
        const equivSlot = document.getElementById('usdEquivSlot');
        if (equivSlot) {
          const label = robuxEquivalentLabel(currentData());
          equivSlot.style.display = label ? '' : 'none';
          equivSlot.innerHTML = `<span class="hint" style="margin-left:0;">${label}</span>`;
        }
      }

      function scheduleUsernameSuggest() {
        const usernameInput = document.getElementById('f_username');
        if (!usernameInput) return;
        const q = usernameInput.value.trim();
        if (usernameSuggestTimer) clearTimeout(usernameSuggestTimer);
        if (q.length < 2) {
          usernameSuggestions = []; usernameSuggestVisible = false; renderUsernameSuggestions();
          return;
        }
        usernameSuggestTimer = setTimeout(async () => {
          try {
            const results = await searchRobloxUsernames(q);
            usernameSuggestions = results.filter(name => name.toLowerCase() !== q.toLowerCase());
            usernameSuggestVisible = usernameSuggestions.length > 0;
          } catch (e) {
            usernameSuggestions = [];
            usernameSuggestVisible = false;
          }
          renderUsernameSuggestions();
        }, 300);
      }

      function pickUsernameSuggestion(name) {
        const usernameInput = document.getElementById('f_username');
        if (usernameInput) usernameInput.value = name;
        usernameSuggestions = [];
        usernameSuggestVisible = false;
        renderUsernameSuggestions();
        updatePreview();
        lookupTargetMethod(name);
      }

      function renderUsernameSuggestions() {
        const slot = document.getElementById('usernameSuggestSlot');
        if (!slot) return;
        if (!usernameSuggestVisible || usernameSuggestions.length === 0) { slot.innerHTML = ''; return; }
        slot.innerHTML = `
          <div class="autocomplete-list">
            ${usernameSuggestions.map(name => `<div class="autocomplete-item" data-pick-username="${esc(name)}">${esc(name)}</div>`).join('')}
          </div>`;
        slot.querySelectorAll('[data-pick-username]').forEach(el => {
          el.addEventListener('mousedown', (e) => { e.preventDefault(); pickUsernameSuggestion(el.dataset.pickUsername); });
        });
      }

      function scheduleTargetMethodLookup() {
        const usernameInput = document.getElementById('f_username');
        if (!usernameInput) return;
        if (targetMethodLookupTimer) clearTimeout(targetMethodLookupTimer);
        targetMethodLookupTimer = setTimeout(() => {
          lookupTargetMethod(usernameInput.value.trim());
        }, 500);
      }

      async function lookupTargetMethod(username) {
        if (!username || username === lastLookedUpUsername) return;
        lastLookedUpUsername = username;
        targetMethodLoading = true;
        targetMethodLoaded = false;
        renderMethodWarning();
        try {
          targetMethod = await getPaymentMethodForUser(username);
        } catch (err) {
          targetMethod = null;
        }
        targetMethodLoading = false;
        targetMethodLoaded = true;
        if (targetMethod && !currencyTouched) {
          const suggestedCurrency = targetMethod.method === 'DEVEX_ROBUX' ? 'ROBUX' : 'USD';
          const currencySelect = document.getElementById('f_currency');
          if (currencySelect && currencySelect.value !== suggestedCurrency) {
            currencySelect.value = suggestedCurrency;
            updatePreview();
          }
        }
        renderMethodWarning();
      }

      function renderMethodWarning() {
        const slot = document.getElementById('methodWarningSlot');
        if (!slot) return;
        if (targetMethodLoading) {
          slot.innerHTML = `<div class="hint" style="margin-left:0;display:block;margin-top:6px;">Checking payment method on file...</div>`;
        } else if (targetMethodLoaded && !targetMethod) {
          slot.innerHTML = `<div class="warn-box" style="margin-top:10px;margin-bottom:0;"><span>No payment method on file yet. You can still submit this, but they'll need to add one under "My payments" before it gets paid.</span></div>`;
        } else if (targetMethodLoaded && targetMethod) {
          slot.innerHTML = `<div class="hint" style="margin-left:0;display:block;margin-top:6px;color:var(--ok-text);">On file: ${esc(methodDisplayLabel(targetMethod))}</div>`;
        } else {
          slot.innerHTML = '';
        }
      }

      async function handleSubmit() {
        const data = currentData();
        const errs = validate(data);
        if (Object.keys(errs).length) {
          fieldErrors = errs;
          submitError = 'Please fix the highlighted fields before submitting.';
          paint();
          return;
        }
        fieldErrors = {};

        if (data.currency === 'ROBUX' && !ignoreEligibility) {
          submitting = true; submitError = null; paint();

          let eligibility = [];
          try {
            eligibility = await getUserEligibility(data.robloxUsername);
          } catch (err) {
            submitting = false;
            submitError = "Could not verify the developer's payout group membership. Check your connection and try again.";
            paint();
            return;
          }

          const missingGroups = eligibility.filter(g => !g.eligible);
          if (missingGroups.length > 0) {
            submitting = false;
            submitError = 'Request failed: the developer does not meet all payout requirements.';
            paint();
            alert(
              'Request failed.\n\n' +
              'The developer is missing:\n\n' +
              missingGroups.map(g => '- ' + g.name).join('\n') +
              '\n\nHave them join, then try again.'
            );
            return;
          }

        }

        submitting = true; submitError = null; paint();
        try {
          await saveRequest(data);
          submitting = false; submitted = true; paint();
        } catch (err) {
          submitting = false;
          submitError = (err && err.message) ? err.message : 'Could not submit this request. Check your connection and try again.';
          paint();
        }
      }

      paint();
      (async () => {
        try { ignoreEligibility = await getIgnoreEligibility(); } catch (e) { }
      })();
    }
  </script>
</body>

</html>
