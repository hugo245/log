<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayVerse Payment Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F5F6F8;
      --surface: #FFFFFF;
      --row-alt: #FAFAFB;
      --input-bg: #FCFCFD;
      --ink: #171A21;
      --ink-soft: #5B616E;
      --muted: #8A93A3;
      --line: #E4E7ED;
      --accent: #3730D9;
      --accent-soft: #EEEDFB;
      --accent-soft-strong: #E2E0FA;
      --btn-primary-bg: #171A21;
      --btn-primary-bg-hover: #000000;
      --btn-primary-text: #FFFFFF;
      --warn-bg: #FFF7E6;
      --warn-line: #F1E4BC;
      --warn-text: #8A6300;
      --ok-bg: #E9F7EF;
      --ok-line: #C7E9D3;
      --ok-text: #178A4C;
      --ok-text-hover: #126B3B;
      --err-bg: #FDEDEC;
      --err-line: #F5C6C0;
      --err-text: #B3311C;
      --radius: 14px;
    }

    :root[data-theme="dark"] {
      --bg: #101114;
      --surface: #1A1B20;
      --row-alt: #1E2026;
      --input-bg: #1E2026;
      --ink: #E6E7EB;
      --ink-soft: #9DA1AC;
      --muted: #6B707C;
      --line: #2A2C33;
      --accent: #7C76E8;
      --accent-soft: #23222E;
      --accent-soft-strong: #2C2A3C;
      --btn-primary-bg: #E6E7EB;
      --btn-primary-bg-hover: #FFFFFF;
      --btn-primary-text: #14161A;
      --warn-bg: #2A2313;
      --warn-line: #443A1E;
      --warn-text: #D8AC50;
      --ok-bg: #132420;
      --ok-line: #1F3B32;
      --ok-text: #4FBF8B;
      --ok-text-hover: #6DD6A3;
      --err-bg: #2A1917;
      --err-line: #45241F;
      --err-text: #E2837A;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    body,
    .panel,
    .topbar,
    input,
    select,
    textarea {
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: .1px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .brand small {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar a.link {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .topbar a.link:hover {
      color: var(--ink);
    }

    .acct-menu {
      position: relative;
    }

    .acct-menu summary {
      list-style: none;
      cursor: pointer;
    }

    .acct-menu summary::-webkit-details-marker {
      display: none;
    }

    .acct-menu-list {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      min-width: 170px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .acct-menu-list a,
    .acct-menu-list button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

    .acct-menu-list a:hover,
    .acct-menu-list button:hover {
      background: var(--bg);
    }

    .acct-menu-list .acct-menu-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 2px;
    }

    .acct-menu-list .acct-menu-label {
      padding: 6px 10px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .hr-pill {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .hr-pill:hover {
      background: var(--bg);
    }

    .theme-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--bg);
      border-color: var(--accent);
    }

    .hr-pill .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok-text);
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .create-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width:900px) {
      .create-grid {
        grid-template-columns: 1fr;
      }
    }

    .heading-block {
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .sub {
      color: var(--ink-soft);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 54ch;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 7px;
      letter-spacing: .2px;
    }

    .field .hint {
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
    }

    .hint {
      font-weight: 400;
      color: var(--muted);
      font-size: 12.5px;
    }

    .field .err-hint {
      color: var(--err-text);
      font-size: 12px;
      margin-top: 5px;
    }

    input[type=text],
    input[type=number],
    input[type=password],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--input-bg);
      transition: border-color .15s, box-shadow .15s;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }

    input.field-invalid,
    textarea.field-invalid,
    select.field-invalid {
      border-color: var(--err-line);
      background: var(--err-bg);
    }

    input:disabled {
      background: var(--bg);
      color: var(--ink-soft);
      cursor: not-allowed;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      border-radius: 9px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform .12s, box-shadow .12s, background .12s, opacity .12s;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--btn-primary-bg-hover);
    }

    .btn-ghost {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-ghost:hover {
      background: var(--accent-soft-strong);
    }

    .btn-ok {
      background: var(--ok-text);
      color: #fff;
    }

    .btn-ok:hover {
      background: var(--ok-text-hover);
    }

    .btn-ok:disabled {
      background: var(--ok-bg);
      color: var(--ok-text);
      cursor: default;
      opacity: 1;
    }

    .btn-danger-ghost {
      background: var(--err-bg);
      color: var(--err-text);
    }

    .btn-danger-ghost:hover {
      background: var(--err-line);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12.5px;
      border-radius: 7px;
    }

    .btn-xs {
      padding: 5px 10px;
      font-size: 11.5px;
      border-radius: 6px;
      gap: 4px;
    }

    .btn-equal {
      flex: 1 1 0;
      width: auto;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .preview-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .invoice {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(20, 22, 30, .03), 0 8px 24px -14px rgba(20, 22, 30, .16);
      overflow: hidden;
    }

    .invoice-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 26px 32px 22px;
    }

    .doc-type {
      text-align: right;
    }

    .doc-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .doc-id {
      font-size: 13px;
      color: var(--ink);
      font-weight: 600;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 0;
    }

    .parties {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 20px 32px;
      gap: 20px;
    }

    .party-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .party-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .party-value.mono {
      font-size: 13px;
    }

    @media (max-width:640px) {
      .parties {
        grid-template-columns: 1fr 1fr;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr !important;
      }
    }

    .task-block {
      padding: 20px 32px;
      border-top: 1px solid var(--line);
    }

    .task-label {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 7px;
    }

    .task-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.2px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 4px 32px 20px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
    }

    .stat-card .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-card .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-card.stat-status .stat-value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
    }

    .stat-card.stat-status.is-paid .stat-value {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-line);
    }

    .items-block {
      padding: 20px 32px 10px;
      border-top: 1px solid var(--line);
    }

    .items-head {
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    .items-list {
      margin: 0;
      padding-left: 20px;
    }

    .items-list li {
      font-size: 13.8px;
      line-height: 1.7;
      color: var(--ink);
      padding: 6px 0 6px 4px;
    }

    .items-list li::marker {
      color: var(--muted);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .items-list li .lead {
      font-weight: 600;
      color: var(--ink);
    }

    .empty-note {
      color: var(--muted);
      font-size: 13px;
      padding: 6px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 32px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .total-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .total-value {
      font-size: 25px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: -.3px;
    }

    .robux-icon {
      height: 1em;
      width: 1em;
      display: inline-block;
      object-fit: contain;
      flex-shrink: 0;
      vertical-align: -0.15em;
    }

    .invoice-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .foot-contact {
      font-size: 12px;
      color: var(--muted);
    }

    .confirm-box {
      background: var(--ok-bg);
      border: 1px solid var(--ok-line);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .confirm-box .icon {
      font-size: 18px;
      line-height: 1;
    }

    .confirm-box .txt strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 3px;
    }

    .confirm-box .txt span {
      color: var(--ink-soft);
      font-size: 13px;
    }

    .error-box {
      background: var(--err-bg);
      border: 1px solid var(--err-line);
      color: var(--err-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .warn-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gate-shell {
      max-width: 400px;
      margin: 90px auto;
      padding: 0 20px;
    }

    .gate-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px 28px;
      text-align: center;
    }

    .gate-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .gate-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .gate-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .gate-card .field {
      text-align: left;
    }

    .gate-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .roblox-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .roblox-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .lock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 26, 33, .55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .lock-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px -20px rgba(20, 22, 30, .45);
    }

    .lock-card .gate-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin: 0 auto 16px;
    }

    .lock-card h2 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .lock-card p {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin: 0 0 20px;
      line-height: 1.55;
    }

    .lock-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .dash-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .dash-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
    }

    .dash-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px;
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 12.5px;
      padding: 7px 13px;
      border-radius: 6px;
      color: var(--ink-soft);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .filter-bar {

      align-items: center;

      return `<button type="button" class="user-link" data-user-link data-user-id="${esc(userId || '')}" data-user-name="${esc(username || '')}">${label}</button>`;
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
      return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
    }
    function gameColor(name) {
      const s = String(name || '');
      let hash = 0;
      for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return hslToHex(hue, 65, 45);
    }

    function copyText(text, btn, label) {
      const done = () => flashBtn(btn, label || 'Copied!');
      const legacyCopy = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) done(); else flashBtn(btn, 'Select and copy');
        } catch (e) { flashBtn(btn, 'Select and copy'); }
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    function flashBtn(btn, msg) {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    function parseWorkLines(raw) {
      return String(raw || '')
        .split('\n')
        .map(l => l.trim().replace(/^->\s*/, '').replace(/^-\s*/, ''))
        .filter(Boolean)
        .map(text => {
          let lead = text, rest = '';
          const periodIdx = text.indexOf('. ');
          if (periodIdx !== -1) { lead = text.slice(0, periodIdx + 1); rest = text.slice(periodIdx + 2); }
          return { lead, rest };
        });
    }

    async function verifySession() {
      const token = getStoredToken();
      if (!token) { isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; hrMaxHierarchy = 0; return; }
      try {
        const [res, onboardingResult] = await Promise.all([
          fetch(EDGE_BASE + '/hr-session', {
            headers: {
              Authorization: 'Bearer ' + token,
              'ngrok-skip-browser-warning': 'true'
            }
          }),
          loadMyOnboarding().catch(() => null)
        ]);
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.ok) {
          isHrAuthed = true;
          hrUsername = json.robloxUsername || '';
          hrRoles = json.roles || [];
          hrPermissions = json.permissions || [];
          hrMaxHierarchy = json.maxHierarchy || 0;
          needsOnboarding = onboardingResult ? onboardingResult.some(s => s.required && !s.completedAt) : false;
          needsDiscordLink = json.discordLinked === false;
        } else {
          isHrAuthed = false;
          hrUsername = '';
          hrRoles = [];
          hrPermissions = [];
          hrMaxHierarchy = 0;
          needsOnboarding = false;
          needsDiscordLink = false;
          clearToken();
        }
      } catch (e) {
        isHrAuthed = false;
        hrUsername = '';
        hrRoles = [];
        hrPermissions = [];
        hrMaxHierarchy = 0;
        needsOnboarding = false;
        needsDiscordLink = false;
      }
    }

      try {

        needsOnboarding = steps.some(s => s.required && !s.completedAt);
      } catch (e) {

      }
    }

      const token = getStoredToken();
      const res = await fetch(EDGE_BASE + '/hr-data', {
        method: 'POST',

          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + (token || ''),
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ action, payload: payload || {} })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.ok) {
        if (res.status === 401) { clearToken(); isHrAuthed = false; hrUsername = ''; hrRoles = []; hrPermissions = []; hrMaxHierarchy = 0; }
        throw new Error((json && json.error) || 'That request failed.');
      }
      return json;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    async function enableRecruitPushNotifications(rt) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('unsupported');
      const publicKey = await fetchPushPublicKey();
      if (!publicKey) throw new Error('not_configured');
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') throw new Error('permission_denied');
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
      await fetch(EDGE_BASE + '/recruitment/push-subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + rt, 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });
      return true;
    }

    function wireUserMenuEvents() {
      const scrim = document.getElementById('umScrim');

      if (closeBtn) closeBtn.addEventListener('click', closeUserMenu);

      const reasonInput = document.getElementById('umReasonInput');
      if (reasonInput) reasonInput.addEventListener('input', () => { umReason = reasonInput.value; });

      const noteBtn = document.getElementById('umNoteBtn');
      if (noteBtn) noteBtn.addEventListener('click', () => runQuickModeration('note'));
      const warnBtn = document.getElementById('umWarnBtn');
      if (warnBtn) warnBtn.addEventListener('click', () => runQuickModeration('warn'));
      const banBtn = document.getElementById('umBanBtn');
      if (banBtn) banBtn.addEventListener('click', () => runQuickModeration('ban'));
      const unbanBtn = document.getElementById('umUnbanBtn');

    async function runQuickModeration(type) {
      if (!umTarget || !umTarget.id) return;
      const reason = umReason.trim();
      if ((type === 'note' || type === 'warn') && !reason) {
        umMsg = { ok: false, text: 'Enter a reason first.' };
        paintUserMenu();
        return;
      }
      if (type === 'ban' && !confirm(`Ban ${umTarget.username || 'this user'}? They will not be able to sign in again.`)) return;
      umBusy = true; umMsg = null; paintUserMenu();
      try {
        const res = await quickModerateUser(umTarget.id, umTarget.username, type, reason);
        const labels = { note: 'Note added.', warn: `Warning issued.${res && res.banned ? ' User reached 3 warnings and was banned.' : ''}`, ban: 'User banned.', unban: 'Ban lifted.' };
        umMsg = { ok: true, text: labels[type] || 'Done.' };
        umReason = '';
        await refreshUserMenuData();
      } catch (e) {
        umMsg = { ok: false, text: e.message || 'That action failed.' };
      }
      umBusy = false;
      paintUserMenu();
      if (typeof window.__refreshCurrentAuditPage === 'function') window.__refreshCurrentAuditPage();
    }

    async function exportRequestsToXlsx(rows, sheetLabel) {
      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'PlayVerse Payment Log';
      workbook.created = new Date();

      const sheetName = (sheetLabel || 'Payments').slice(0, 31);
      const sheet = workbook.addWorksheet(sheetName, { views: [{ showGridLines: false }] });

      sheet.columns = [
        { width: 5 },
        { width: 26 },
        { width: 22 },
        { width: 20 },
        { width: 52 },
        { width: 12 },
        { width: 12 },
        { width: 12 },
        { width: 12 },
        { width: 14 }
      ];

      sheet.mergeCells('A1:J3');
      const banner = sheet.getCell('A1');
      banner.value = 'PlayVerse Payment Log';
      banner.font = { name: 'Arial', size: 20, bold: true, color: { argb: 'FFFFFFFF' } };
      banner.alignment = { vertical: 'middle', horizontal: 'left', indent: 2 };
      for (let r = 1; r <= 3; r++) {
        for (let c = 1; c <= 10; c++) {
          sheet.getCell(r, c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF171A21' } };
        }
      }

      sheet.mergeCells('A4:J4');
      const sub = sheet.getCell('A4');
      sub.value = `Exported ${new Date().toLocaleString()}, DevEx rate ${(DEVEX_RATE * 10000).toFixed(2)} USD per 10,000 Robux`;
      sub.font = { name: 'Arial', size: 10, italic: true, color: { argb: 'FF5B616E' } };

      const headerRowNum = 6;
      const headers = ['#', 'DEV RBLX USERNAME', 'PRODUCER', 'GAME', 'TASK/BUG TITLE', 'APPROVED', 'PAID', 'R$', 'USD', 'DATE'];
      const headerRow = sheet.getRow(headerRowNum);
      headers.forEach((h, i) => { headerRow.getCell(i + 1).value = h; });
      headerRow.eachCell(cell => {
        cell.font = { name: 'Arial', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF171A21' } };
        cell.alignment = { vertical: 'middle', horizontal: 'left' };
      });
      headerRow.height = 22;
      sheet.views = [{ state: 'frozen', ySplit: headerRowNum, showGridLines: false }];

      rows.forEach((d, i) => {
        const rowNum = headerRowNum + 1 + i;
        const isRobux = d.currency === 'ROBUX';
        const row = sheet.getRow(rowNum);
        row.getCell(1).value = i + 1;
        row.getCell(2).value = d.robloxUsername || '';
        row.getCell(3).value = d.requestedBy || '';
        row.getCell(4).value = d.game || '';
        row.getCell(5).value = d.taskName || '';
        row.getCell(6).value = true;
        row.getCell(7).value = !!d.paid;
        if (isRobux) {
          row.getCell(8).value = Number(d.payment) || 0;
          row.getCell(9).value = { formula: `IF(H${rowNum}="","",H${rowNum}*${DEVEX_RATE})` };
        } else {
          row.getCell(8).value = '';
          row.getCell(9).value = Number(d.payment) || 0;
        }
        row.getCell(10).value = new Date(d.createdAt || Date.now());
        row.getCell(10).numFmt = 'dd/mm/yyyy';
        row.getCell(8).numFmt = '#,##0';
        row.getCell(9).numFmt = '$#,##0.00';
        row.eachCell(cell => {
          cell.border = { bottom: { style: 'thin', color: { argb: 'FFE4E7ED' } } };
          cell.font = { name: 'Arial', size: 11 };
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `playverse-payments-${(sheetLabel || 'all').toLowerCase()}-${stamp}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function route() {
      if (!authReady) return;
      renderGen++;
      const path = window.location.hash.split('?')[0];
      if (path === '#/auth-callback') { handleAuthCallback(); return; }

      if (path.indexOf('#/join/') === 0) {
        const token = decodeURIComponent(path.slice('#/join/'.length));
        handleJoinLink(token);
        return;
      }

      if (isHrAuthed && needsOnboarding && path !== '#/onboarding' && path !== '#/tos' && path !== '#/aup') {
        window.location.hash = '#/onboarding';
        return;
      }

      const RECRUIT_ONLY_PATHS = ['#/recruit', '#/recruit/apply', '#/recruit/status'];
      if (isHrAuthed && RECRUIT_ONLY_PATHS.includes(path)) {
        window.location.hash = '#/';
        return;
      }

      if (path === '#/tos') {
        if (isHrAuthed) renderPolicyPage('tos'); else renderHrGate();
      } else if (path === '#/aup') {
        if (isHrAuthed) renderPolicyPage('aup'); else renderHrGate();
      } else if (path === '#/hr' || path === '#/dashboard') {
        if (isHrAuthed) renderDashboard(); else renderHrGate();
      } else if (path === '#/manage') {
        if (isHrAuthed) renderManagePanel(); else renderHrGate();
      } else if (path === '#/analytics') {
        if (isHrAuthed) renderAnalytics(); else renderHrGate();
      } else if (path === '#/my') {
        if (isHrAuthed) renderMyPayments(); else renderHrGate();
      } else if (path === '#/new') {
        if (isHrAuthed && canSubmitRequests()) renderCreateView(); else if (isHrAuthed) renderMyPayments(); else renderHrGate();
      } else if (path === '#/onboarding') {
        if (isHrAuthed) renderOnboarding(); else renderHrGate();
      } else if (path === '#/staff') {
        if (isHrAuthed) renderStaffDatabase(); else renderHrGate();
      } else if (path === '#/audit') {
        if (isHrAuthed) renderAuditLogs(); else renderHrGate();
      } else if (path === '#/recruit') {

      } else if (path === '#/recruit/apply') {

    function renderRecruitApply() {
      const params = parseHashQuery();
      const rtParam = params.get('rt');
      if (rtParam) storeRecruitToken(rtParam);
      const rt = rtParam || getRecruitToken();
      const err = params.get('error');

      if (!rt) { window.location.hash = '#/'; return; }

      const myGen = renderGen;
      let info = null;
      let recruiters = [];
      let positions = [];
      let loading = true;
      let loadFailed = false;
      let submitting = false;
      let submitError = err ? (RECRUIT_ERROR_MESSAGES[err] || 'Something went wrong, please try again.') : null;
      let fieldErrors = {};

      paint();
      Promise.all([fetchRecruitSession(rt), loadPublicRecruiters(), loadPublicPositions()]).then(([sessionInfo, recruiterList, positionList]) => {
        if (renderGen !== myGen) return;
        info = sessionInfo;
        recruiters = recruiterList;
        positions = positionList;
        fetchMyTicket(rt).then(() => {
          if (renderGen !== myGen) return;
          window.location.hash = '#/recruit/status';
        }).catch(() => {
          if (renderGen !== myGen) return;
          loading = false;
          paint();
        });
      }).catch(() => {
        if (renderGen !== myGen) return;
        loading = false; loadFailed = true; paint();

      function paint() {
        app.innerHTML = `
    ${topbar()}
    <div class="gate-shell">
      <div class="gate-card" style="max-width:560px;">
        <div class="gate-icon">PV</div>
        ${loading ? `<h2>Loading...</h2>` : loadFailed ? `

          ${submitError ? `<div class="error-box"><span>${esc(submitError)}</span></div>` : ''}
          <div style="text-align:left;display:flex;flex-direction:column;gap:14px;margin-top:6px;">
            <div class="field">
              <label>Position you're applying for <span class="hint">(optional)</span></label>
              <select id="ap_position">
                <option value="">Not sure / general application</option>
                ${positions.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Portfolio link <span class="hint">(optional)</span></label>
              <input type="text" id="ap_portfolio" placeholder="https://...">
            </div>
            <div class="field">
              <label>Relevant experience</label>
              <textarea id="ap_experience" rows="4" placeholder="Games you've worked on, roles held, links to previous work..." class="${fieldErrors.experience ? 'field-invalid' : ''}"></textarea>
              ${fieldErrors.experience ? `<div class="err-hint">${esc(fieldErrors.experience)}</div>` : ''}
            </div>
            <div class="field">
              <label>Why do you want to join PlayVerse?</label>
              <textarea id="ap_why" rows="4" class="${fieldErrors.whyJoin ? 'field-invalid' : ''}"></textarea>
              ${fieldErrors.whyJoin ? `<div class="err-hint">${esc(fieldErrors.whyJoin)}</div>` : ''}
            </div>
            <div class="field">
              <label>Were you referred by a staff member? <span class="hint">(optional)</span></label>
              <select id="ap_referrer">
                <option value="">No one / not sure</option>
                ${recruiters.map(r => `<option value="${esc(r.robloxUserId)}">${esc(r.robloxUsername)}</option>`).join('')}
              </select>
            </div>
            <button type="button" class="btn btn-primary" id="applySubmitBtn" ${submitting ? 'disabled' : ''}>${submitting ? 'Submitting...' : 'Submit application'}</button>
          </div>
        `}
      </div>
    </div>`;
        wireTopbarSignOut();

        const retryBtn = document.getElementById('applyRetryBtn');
        if (retryBtn) retryBtn.addEventListener('click', () => beginLogin('#/'));

        const linkBtn = document.getElementById('applyLinkDiscordBtn');
        if (linkBtn) linkBtn.addEventListener('click', () => {
          window.location.href = EDGE_BASE + '/discord-auth-start?rt=' + encodeURIComponent(rt) + '&return=' + encodeURIComponent('#/recruit/apply');
        });

        const submitBtn = document.getElementById('applySubmitBtn');
        if (submitBtn) submitBtn.addEventListener('click', async () => {
          const experience = (document.getElementById('ap_experience').value || '').trim();
          const whyJoin = (document.getElementById('ap_why').value || '').trim();
          const portfolioUrl = (document.getElementById('ap_portfolio').value || '').trim() || null;
          const position = document.getElementById('ap_position').value || null;
          const referredByUserId = document.getElementById('ap_referrer').value || null;
          const errs = {};
          if (!experience) errs.experience = 'Please share a bit about your experience.';
          if (!whyJoin) errs.whyJoin = "Let us know why you'd like to join.";
          if (portfolioUrl && !safeUrl(portfolioUrl)) errs.portfolioUrl = 'Please enter a valid http:// or https:// link.';
          if (Object.keys(errs).length) { fieldErrors = errs; submitError = null; paint(); return; }
          fieldErrors = {};
          submitting = true; submitError = null; paint();
          try {
            await submitRecruitmentApplication(rt, {
              experience,
              whyJoin,
              portfolioUrl,
              positionId: position,
              referredByUserId
            });
            submitting = false;
            window.location.hash = '#/recruit/status';
          } catch (e) {
            submitting = false;
            if (e.message === 'application_already_open') { window.location.hash = '#/recruit/status'; return; }
            submitError = RECRUIT_ERROR_MESSAGES[e.message] || 'Could not submit your application. Please try again.';
            paint();
          }
        });
      }
    }

    function renderRecruitStatus() {
      const rt = getRecruitToken();
      if (!rt) {
        app.innerHTML = `${topbar()}<div class="gate-shell"><div class="gate-card"><div class="gate-icon">PV</div><h2>Sign in required</h2><p>Sign in with Roblox to check your application status.</p><button type="button" class="btn btn-primary roblox-btn" id="statusSignInBtn">Sign in with Roblox</button></div></div>`;
        wireTopbarSignOut();
        const btn = document.getElementById('statusSignInBtn');
        if (btn) btn.addEventListener('click', () => beginLogin('#/'));
        return;
      }

      const myGen = renderGen;
      let data = null;
      let loading = true;
      let loadError = null;
      let pollTimer = null;
      let rolingCountdownTimer = null;
      let notifyModalShown = false;
      let notifyBusy = false;
      let notifyError = null;

      load(true);

      async function load(showSpinner) {
        if (showSpinner) { loading = true; paint(); }
        const prevData = data;
        const prevLoadError = loadError;
        try {
          const [ticketData, sessionInfo] = await Promise.all([
            fetchMyTicket(rt),
            fetchRecruitSession(rt).catch(() => null)
          ]);
          if (sessionInfo && sessionInfo.hasFullAccess) {
            if (pollTimer) clearInterval(pollTimer);
            clearRecruitToken();
            beginLogin('#/');
            return;
          }
          data = ticketData;
          loading = false; loadError = null;
        } catch (e) {
          loading = false;
          loadError = e.message === 'no_ticket' ? 'no_ticket' : (e.message || 'Could not load your application.');
        }
        if (renderGen !== myGen) return;

        // Only repaint when something actually changed - a background poll that redraws the whole
        // page every 4s even when nothing's different just flashes the screen for no reason.
        const changed = showSpinner || loadError !== prevLoadError || JSON.stringify(data) !== JSON.stringify(prevData);

          pollTimer = setInterval(() => { if (renderGen !== myGen) { clearInterval(pollTimer); return; } load(false); }, 4000);

    function renderRecruitmentDashboard() {

      async function refreshTicketsQuiet() {
        try {

              paintModal();
            }
          } catch (e) { }

      ${loading ? `<div class="panel" style="padding:40px;text-align:center;color:var(--muted);">Loading applications...</div>`

                : `<div class="panel" style="padding:0;overflow:hidden;">

            </table>

    <div id="nextPhaseOverlayContainer"></div>`;

        wireTopbarSignOut();

              ${canSignOffTicket() ? `

      function wireTicketModal() {
        const scrim = document.getElementById('ticketModalScrim');
        if (!scrim) return;
        const close = () => { if (ticketPollTimer) clearInterval(ticketPollTimer); openTicketId = null; ticketDetail = null; nextPhaseModalOpen = false; allSetModalOpen = false; paint(); };
        document.getElementById('ticketModalClose').addEventListener('click', close);
        scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });

        document.querySelectorAll('[data-set-status]').forEach(el => {
          el.addEventListener('click', async () => {
            busy = true; paintModal();
            try {
              await updateRecruitmentStatus(openTicketId, el.dataset.setStatus);
              const [detail, freshTickets] = await Promise.all([
                loadRecruitmentTicket(openTicketId),
                loadRecruitmentTickets(statusFilter)
              ]);
              ticketDetail = detail;
              tickets = freshTickets;
            } catch (e) { }
            busy = false; paintModal();
          });
        });

        const assignSelect = document.getElementById('ticketAssignSelect');
        if (assignSelect) assignSelect.addEventListener('change', async () => {
          const val = assignSelect.value;
          const match = recruiters.find(r => String(r.robloxUserId) === val);
          try {
            await assignRecruitmentTicket(openTicketId, match ? match.robloxUserId : null, match ? match.robloxUsername : null);
            ticketDetail = await loadRecruitmentTicket(openTicketId);
          } catch (e) { }
          paintModal();
        });

        const nextPhaseBtn = document.getElementById('nextPhaseBtn');
        if (nextPhaseBtn) nextPhaseBtn.addEventListener('click', async () => {
          nextPhaseModalOpen = true; nextPhaseError = null; nextPhaseSelectedSkillsetId = '';
          nextPhaseSkillsetsLoading = true; paintNextPhaseOverlay();
          try {
            nextPhaseSkillsets = await loadSkillsetsForNextPhase();
          } catch (e) {
            nextPhaseError = 'Could not load skillsets.';
          }
          nextPhaseSkillsetsLoading = false; paintNextPhaseOverlay();
        });

        const placeTeamSelect = document.getElementById('placeTeamSelect');
        if (placeTeamSelect) placeTeamSelect.addEventListener('change', () => { placeTeamSelectedId = placeTeamSelect.value; });

        const placeTeamBtn = document.getElementById('placeTeamBtn');
        if (placeTeamBtn) placeTeamBtn.addEventListener('click', async () => {
          const teamId = (document.getElementById('placeTeamSelect') || {}).value || placeTeamSelectedId;
          if (!teamId) { placeTeamError = 'Please choose a team.'; paintModal(); return; }
          placeTeamBusy = true; placeTeamError = null; paintModal();
          try {
            await placeRecruitmentTicketTeam(openTicketId, teamId);
            const [detail, freshTickets] = await Promise.all([
              loadRecruitmentTicket(openTicketId),
              loadRecruitmentTickets(statusFilter)
            ]);
            ticketDetail = detail;
            tickets = freshTickets;
            placeTeamSelectedId = '';
          } catch (e) {
            placeTeamError = e.message || 'Could not place them on that team.';
          }
          placeTeamBusy = false; paintModal();
        });

        const manualRolingBtn = document.getElementById('manualRolingBtn');
        if (manualRolingBtn) manualRolingBtn.addEventListener('click', async () => {
          manualRolingBusy = true; manualRolingMsg = null; paintModal();
          try {
            const data = await manualRolingRecruitmentTicket(openTicketId);
            manualRolingMsg = { ok: true, text: data && data.mode === 'inserted' ? 'Finalised - access granted just now.' : 'Already up to date - roled in.' };
            try { ticketDetail = await loadRecruitmentTicket(openTicketId); } catch (e) { }
          } catch (e) {
            manualRolingMsg = { ok: false, text: e.message || 'Could not finalise this recruit.' };
          }
          manualRolingBusy = false; paintModal();
        });

        const signOffBtn = document.getElementById('signOffBtn');
        if (signOffBtn) signOffBtn.addEventListener('click', async () => {
          signOffBusy = true; signOffMsg = null; paintModal();
          try {
            const data = await signOffRecruitmentTicket(openTicketId);
            signOffMsg = { ok: true, text: data && data.producersNotified ? `Signed off - notified ${data.producersNotified} producer(s).` : 'Signed off.' };
            try { ticketDetail = await loadRecruitmentTicket(openTicketId); } catch (e) { }
          } catch (e) {
            signOffMsg = { ok: false, text: e.message || 'Could not sign this off.' };
          }
          signOffBusy = false; paintModal();
        });
      }

      function wireNextPhaseModal() {
        const scrim = document.getElementById('nextPhaseModalScrim');
        if (!scrim) return;
        const close = () => { nextPhaseModalOpen = false; nextPhaseError = null; paintNextPhaseOverlay(); };
        document.getElementById('nextPhaseModalClose').addEventListener('click', close);

        scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });

        const select = document.getElementById('nextPhaseSkillsetSelect');

    function renderDashboard() {
      if (!hasPermission('dashboard.view')) { window.location.hash = hasPermission('settings.manage_games') || hasPermission('settings.manage_rate') || hasPermission('settings.manage_groups') || hasPermission('settings.manage_base_access') || hasPermission('roles.manage') || hasPermission('settings.manage_onboarding') ? '#/manage' : '#/'; return; }
      const myGen = renderGen;
      let allRequests = [];
      let filter = 'pending';
      let search = '';
      let roleFilter = 'all';
      let teamFilter = 'all';
      let skillsetFilter = 'all';
      let expanded = new Set();
      let loading = true;
      let loadError = null;
      let eligibilityCache = {};
      let eligibilityLoading = new Set();

      const canMarkPaid = hasPermission('dashboard.mark_paid');
      const canExport = hasPermission('dashboard.export');

      function getAllRoles() {
        const roles = new Set();
        allRequests.forEach(r => (r.requesterRoles || []).forEach(role => roles.add(role)));
        return Array.from(roles).sort();
      }

      function getAllTeams() {
        const teams = new Set();
        allRequests.forEach(r => { if (r.requesterTeam) teams.add(r.requesterTeam); });
        return Array.from(teams).sort();
      }

      function getAllSkillsets() {
        const skillsets = new Set();
        allRequests.forEach(r => { if (r.requesterSkillset) skillsets.add(r.requesterSkillset); });
        return Array.from(skillsets).sort();
      }

      function getRows() {
        let rows = allRequests.filter(r => filter === 'all' ? true : r.status === filter);
        if (roleFilter !== 'all') {
          rows = rows.filter(r => (r.requesterRoles || []).includes(roleFilter));
        }
        if (teamFilter !== 'all') {
          rows = rows.filter(r => r.requesterTeam === teamFilter);
        }
        if (skillsetFilter !== 'all') {
          rows = rows.filter(r => r.requesterSkillset === skillsetFilter);
        }
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          rows = rows.filter(r => (r.robloxUsername || '').toLowerCase().includes(q) || (r.taskName || '').toLowerCase().includes(q) || (r.game || '').toLowerCase().includes(q) || (r.requestedBy || '').toLowerCase().includes(q));
        }
        return rows;
      }

        const items = parseWorkLines(r.workRaw || '');
        const isOpen = expanded.has(r.id);
        const statusLabel = r.status === 'paid' ? `Paid ${esc(fmtDate(r.paidAt || Date.now()))}` : r.status === 'rejected' ? 'Rejected' : 'Pending';
        const rowHtml = `
            <tr>

              <td class="task-cell">

                ${r.skillsetNames && r.skillsetNames.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">${r.skillsetNames.map(name => `<span class="skill-badge">${esc(name)}</span>`).join('')}</div>` : ''}
                <div class="task-count">${items.length} item${items.length === 1 ? '' : 's'}${r.game ? ` &middot; <span class="game-badge" style="background:${gameColor(r.game)};">${esc(r.game)}</span>` : ''}${r.timeWorked ? ` &middot; ${esc(r.timeWorked)}` : ''}</div>
              </td>
              <td class="pay-cell">${fmtAmount(r)}${r.currency === 'ROBUX' ? `<div style="font-weight:500;color:var(--muted);font-size:11px;margin-top:2px;">${devexEquivalent(r)}</div>` : ''}</td>
